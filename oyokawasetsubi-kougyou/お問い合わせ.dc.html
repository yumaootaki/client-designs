<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Semi+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{margin:0;}
.line-chunk{display:inline-block;overflow-wrap:anywhere;word-break:normal;}
::selection{background:#1F5FAF;color:#fff;}
@media (max-width:1024px){ section[data-screen-label$="ヒーロー"]{min-height:38svh !important;} }
.parts213_form_wrap dl{display:grid;grid-template-columns:clamp(170px,22vw,250px) 1fr;gap:clamp(10px,2vw,32px);align-items:start;padding:clamp(18px,2.2vw,26px) 0;border-bottom:1px solid #D5DCE5;}
@media (max-width:640px){.parts213_form_wrap dl{grid-template-columns:1fr;gap:8px;}}
.parts213_form_wrap dt{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:600;font-size:15.5px;color:#1A2230;padding-top:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.parts213_form_wrap dt.form_text_dt{align-items:flex-start;}
.parts213_form_wrap dd{margin:0;}
.parts213_form_wrap input[type=text],.parts213_form_wrap input[type=email],.parts213_form_wrap textarea{width:100%;font-family:inherit;font-size:15px;color:#1A2230;background:#fff;border:1px solid #C3CCD8;border-radius:2px;padding:12px 14px;line-height:1.7;}
.parts213_form_wrap input:focus,.parts213_form_wrap textarea:focus{outline:2px solid #1F5FAF;outline-offset:1px;border-color:#1F5FAF;}
.parts213_form_wrap textarea{min-height:170px;resize:vertical;}
.parts213_form_wrap .checkbox_list{display:flex;flex-wrap:wrap;gap:10px 18px;padding-top:8px;}
.parts213_form_wrap .checkbox_list label{display:inline-flex;align-items:center;gap:9px;font-size:15px;color:#2A3445;cursor:pointer;padding:8px 0;min-height:44px;}
.parts213_form_wrap .checkbox_list input[type=checkbox]{width:19px;height:19px;accent-color:#1F5FAF;cursor:pointer;}
.parts213_form_wrap .required{font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;background:#0B2E59;padding:3px 8px;border-radius:2px;}
.parts213_form_wrap .attention{display:block;margin-top:4px;font-size:12px;font-weight:400;color:#0B2E59;font-family:'Zen Kaku Gothic New',sans-serif;line-height:1.7;}
.parts213_form_wrap .error{margin:6px 0 0;font-size:12.5px;color:#0B2E59;}
.contact_submit{margin-top:clamp(26px,3.4vw,40px);text-align:center;}
.contact_submit input{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:600;font-size:16px;letter-spacing:.06em;color:#fff;background:#0B2E59;border:none;border-radius:2px;padding:17px 56px;cursor:pointer;transition:background .35s;}
.contact_submit input:hover{background:#1F5FAF;}
@keyframes ni-pan{0%{transform:scale(1.08) translate3d(0,0,0);}100%{transform:scale(1.16) translate3d(-2%,-1.5%,0);}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
</helmet>

<div style="font-family:'Zen Kaku Gothic New',sans-serif; color:#1A2230; background:#F4F6F9; -webkit-font-smoothing:antialiased; line-height:1.85; overflow-x:hidden;">

  <dc-import name="SiteHeader" accent="{{ accent }}" active="" page-title="お問い合わせ｜株式会社オヨカワ設備工業（千葉県匝瑳市）" description="株式会社オヨカワ設備工業へのお問い合わせ。新規のお取引・お見積り・協力会社のご相談、個人の水回りリフォーム・水漏れのご相談、採用へのご応募を受け付けています。" hint-size="100%,84px"></dc-import>

  <section data-screen-label="お問い合わせヒーロー" style="position:relative; min-height:50svh; display:flex; align-items:flex-end; overflow:hidden; background:#4d4d4d; color:#F4F6F9;"><div aria-hidden="true" style="position:absolute; inset:0; z-index:1; background:linear-gradient(to right, rgba(11,46,89,.9) 0%, rgba(11,46,89,.8) 55%, rgba(8,36,72,.4) 100%), url('assets/p-kitchen.jpg') center/cover no-repeat;"></div>
    <div aria-hidden="true" style="position:absolute; inset:0; background:radial-gradient(120% 95% at 50% 16%, rgba(31,95,175,.4), rgba(6,26,54,0) 56%), linear-gradient(270deg,#0B2E59 0%,#061a36 60%,#030d1f 100%); animation:ni-pan 24s ease-in-out infinite alternate; transform-origin:50% 26%;"></div>
    <div aria-hidden="true" style="position:absolute; inset:0; opacity:.14; background-image:repeating-linear-gradient(125deg, rgba(190,210,235,.5) 0 1px, transparent 1px 16px); mix-blend-mode:screen;"></div>
    <div aria-hidden="true" style="position:absolute; right:clamp(-14px,-1vw,0px); bottom:clamp(8px,3vh,30px); font-family:'Barlow Semi Condensed',sans-serif; font-weight:400; font-size:clamp(96px,22vw,300px); line-height:.8; color:rgba(190,210,235,.07); white-space:nowrap; pointer-events:none;">Contact</div>
    <div aria-hidden="true" style="position:absolute; inset:0; background:linear-gradient(to right, rgba(3,14,32,.9) 0%, rgba(3,14,32,.35) 55%, transparent 100%);"></div>
    <div style="position:relative; z-index:2; width:100%; max-width:1340px; margin:0 auto; padding:clamp(88px,12vh,116px) clamp(18px,4vw,46px) clamp(40px,5vh,56px);">
      <nav aria-label="パンくず" style="display:flex; flex-wrap:wrap; align-items:center; gap:9px; font-size:12.5px; letter-spacing:.04em; color:rgba(244,246,249,.66); margin-bottom:clamp(20px,3vw,32px);">
        <a href="/" style="color:rgba(244,246,249,.66); text-decoration:none;">ホーム</a>
        <span aria-hidden="true" style="opacity:.5;">/</span>
        <span style="color:#A9C4E8;">お問い合わせ</span>
      </nav>
      <p style="margin:0 0 14px; font-family:'Barlow Semi Condensed',sans-serif; font-size:clamp(15px,2vw,20px); letter-spacing:.08em; color:#ffffff; display:flex; align-items:center; gap:14px;"><span style="display:inline-block; width:clamp(28px,4vw,52px); height:1px; background:#ffffff;"></span>Contact</p>
      <h1 style="margin:0; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:800; font-size:clamp(38px,6.4vw,92px); line-height:1.06; letter-spacing:.02em; text-shadow:0 12px 46px rgba(0,0,0,.42);">お問い合わせ</h1>
    </div>
  </section>

  <!-- 🔒 CMS固定領域（parts213系）：構造/クラス/input name 変更禁止・承認/解除なし。見た目はadd.cssのみ -->
  <!-- 🔒 LOCK START -->
  <section class="contact_section" data-screen-label="お問い合わせフォーム" style="background:#F4F6F9; padding:clamp(72px,11vh,130px) 0;">
    <div style="max-width:880px; margin:0 auto; padding:0 clamp(18px,4vw,46px);">
      <div class="parts210_section_content" data-reveal style="margin-bottom:clamp(34px,4.5vw,52px);">
        <div class="parts210_content_wrap">
          <p class="parts210_content" style="margin:0 0 8px; font-size:clamp(15px,1.7vw,18px); line-height:2.05; color:#1A2230; font-family:'Zen Kaku Gothic New',sans-serif; font-weight:600;">新規のお取引・お見積り、個人のお客様のご相談、採用へのご応募はこちらから。</p>
          <p style="margin:0 0 22px; font-size:clamp(14.5px,1.6vw,16px); line-height:2; color:#4A5566;">下記フォームに必要事項をご入力のうえ、確認画面へお進みください。お電話でも承っております。<span style="color:#0B2E59;">必須</span>の項目はご入力をお願いします。</p>
          <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:#E8EDF3; border:1px solid #D5DCE5; border-radius:3px; padding:clamp(16px,2vw,22px) clamp(18px,2.2vw,26px);">
            <span style="font-family:'Barlow Semi Condensed',sans-serif; font-size:14px; color:{{ accent }};">By Phone</span>
            <a href="tel:0479-79-2707" style="text-decoration:none; color:#1A2230; font-family:'Barlow Semi Condensed',sans-serif; font-weight:600; font-size:clamp(24px,3vw,32px); letter-spacing:.03em;">0479-79-2707</a>
            <span style="font-size:13px; color:#667085;">受付 8:00〜17:00（日曜・祝日除く）</span>
          </div>
        </div>
      </div>

      <div class="parts213_section_form">
        <div class="parts213_form_wrap">
          <form method="POST" action="/form/confirm/inquiry">
            <dl><dt>お名前／企業名 <span class="required">必須</span></dt><dd><input name="name" type="text" placeholder="例：株式会社○○ ／ 山田 太郎"><p class="error"></p></dd></dl>
            <dl><dt>メールアドレス <span class="required">必須</span></dt><dd><input name="email" type="email" placeholder="例：info@example.com"><p class="error"></p></dd></dl>
            <dl><dt>メールアドレス（確認用） <span class="required">必須</span></dt><dd><input name="email_confirmation" type="email" placeholder="確認のため再度ご入力ください"><p class="error"></p></dd></dl>
            <dl><dt>お問い合わせ項目 <span class="required">必須</span></dt><dd><div class="checkbox_list"><label><input type="checkbox" name="checkbox[]" value="ご相談・お見積り">新規取引・お見積りのご相談（企業の方）</label><label><input type="checkbox" name="checkbox[]" value="工事のお問い合わせ">リフォーム・水漏れのご相談（個人の方）</label><label><input type="checkbox" name="checkbox[]" value="求人について">採用への応募</label><label><input type="checkbox" name="checkbox[]" value="その他">その他</label></div><p class="error"></p></dd></dl>
            <dl class="form_textarea"><dt class="form_text_dt"><span>お問い合わせ内容<span class="attention">入力は2000文字以内で日本語を含んだ文章でお願いいたします。</span></span> <span class="required">必須</span></dt><dd><textarea name="qualification" id="qualification" placeholder="お問い合わせ内容をご記入ください。"></textarea><p class="error"></p></dd></dl>
            <div class="contact_submit"><input type="submit" value="確認画面へ"></div>
          </form>
        </div>
      </div>
    </div>
  </section>
  <!-- 🔒 LOCK END -->

  <dc-import name="SiteFooter" hint-size="100%,360px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#1F5FAF&quot;, &quot;options&quot;: [&quot;#1F5FAF&quot;, &quot;#0B2E59&quot;, &quot;#2A6FC4&quot;, &quot;#174C8F&quot;], &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  state = { mobile:false, menuOpen:false, scrolled:false };
  componentDidMount(){
    this.mq = window.matchMedia('(max-width: 960px)');
    this._onMq = (e)=> this.setState({ mobile: e.matches });
    this._onMq(this.mq); this.mq.addEventListener('change', this._onMq);
    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this._onScroll = ()=>{ const v = window.scrollY > 40; if(v !== this.state.scrolled) this.setState({ scrolled:v }); };
    window.addEventListener('scroll', this._onScroll, { passive:true });
    if(!this.reduced){
      this.io = new IntersectionObserver((ents)=>{ ents.forEach(en=>{ if(en.isIntersecting){ en.target.style.opacity='1'; en.target.style.transform='none'; this.io.unobserve(en.target); } }); }, { threshold:0.08, rootMargin:'0px 0px -7% 0px' });
      requestAnimationFrame(()=>{ document.querySelectorAll('[data-reveal]').forEach((el)=>{ el.style.opacity='0'; el.style.transform='translateY(26px)'; el.style.transitionProperty='opacity, transform'; el.style.transitionDuration='1s'; el.style.transitionTimingFunction='cubic-bezier(.2,.7,.2,1)'; this.io.observe(el); }); });
    }
  }
  componentWillUnmount(){ if(this.mq) this.mq.removeEventListener('change', this._onMq); window.removeEventListener('scroll', this._onScroll); if(this.io) this.io.disconnect(); }
  renderVals(){
    const accent = this.props.accentColor || '#1F5FAF';
    const sc = this.state.scrolled || this.state.menuOpen;
    return {
      accent,
      isMobile: this.state.mobile, isDesktop: !this.state.mobile,
      menuOpen: this.state.menuOpen,
      toggleMenu: ()=> this.setState(s=>({ menuOpen: !s.menuOpen })),
      closeMenu: ()=> this.setState({ menuOpen:false }),
      headerBg: sc ? 'rgba(244,246,249,0.92)' : 'transparent',
      headerColor: sc ? '#1A2230' : '#F4F6F9',
      headerBorder: sc ? '1px solid rgba(26,34,48,0.1)' : '1px solid rgba(255,255,255,0)',
      headerShadow: sc ? '0 14px 36px -26px rgba(0,0,0,0.55)' : 'none',
      headerBlur: sc ? 'saturate(1.1) blur(14px)' : 'none',
      ctaBtnColor: sc ? '#ffffff' : '#0B2E59',
      ctaBtnBg: sc ? accent : '#F4F6F9',
      year: new Date().getFullYear()
    };
  }
}
</script>
</body>
</html>
