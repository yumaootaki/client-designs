<body>
<x-dc>
<helmet>
<title>サイトマップ｜高崎市の外壁塗装・屋根塗装 星野美装</title>

<meta property="og:type" content="website">
<meta property="og:site_name" content="株式会社 星野美装">
<meta property="og:image" content="images/ogp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<script src="./nav-router.js"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#ffffff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
span.line-chunk{display:inline-block;overflow-wrap:anywhere;word-break:normal}
@keyframes bleedReveal{0%{opacity:0;transform:translateY(26px);filter:blur(8px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;scroll-behavior:auto !important;transition:none !important}}
</style>
<script src="nav-router.js"></script>
</helmet>
<div id="top" style="--accent:{{ accent }};--beige:{{ beige }};--dark:{{ dark }};--mustard:{{ mustard }};--teal:{{ teal }};font-family:'Noto Sans JP',sans-serif;color:#3A3428;overflow-x:hidden;position:relative">

  <dc-import name="SiteHeader" accent="{{ accent }}" hint-size="100%,0px" style="display:block;height:0"></dc-import>
<section id="pagehead" data-screen-label="下層ヘッダー" style="position:relative;padding-top:calc(64px + 2 * clamp(8px,1.4vw,16px));margin-bottom:clamp(1rem,3vw,2.4rem)"><div aria-hidden="true" style="position:absolute;top:0;left:0;right:clamp(20px,5vw,80px);bottom:0;overflow:hidden;border-radius:0 0 clamp(40px,7vw,90px) 0;background-color:#EDE5D2;background-image:radial-gradient(#FFFFFF 1.8px,transparent 1.8px),radial-gradient(#FFFFFF 1.8px,transparent 1.8px);background-size:22px 22px,22px 22px;background-position:0 0,11px 11px;pointer-events:none"></div><div aria-hidden="true" style="position:absolute;right:clamp(10px,6vw,110px);bottom:clamp(-30px,-2vw,-10px);width:min(300px,34vw);aspect-ratio:1.1;border-radius:47% 53% 54% 46% / 47% 53% 47% 53%;border:3px solid #9BC46A;pointer-events:none"></div><div style="position:relative;max-width:1280px;margin:0 auto;padding:clamp(2.4rem,6vw,4.5rem) clamp(1.5rem,6vw,7rem) clamp(2.6rem,5vw,4rem)"><p style="font-family:'Zen Maru Gothic',sans-serif;font-size:clamp(1.6rem,1rem + 2.6vw,3.2rem);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;color:#3A3428;margin:0 0 clamp(.9rem,2vw,1.4rem);display:flex;align-items:center;flex-wrap:wrap;gap:clamp(10px,1.5vw,16px)"><span aria-hidden="true" style="width:clamp(11px,1.5vw,15px);height:clamp(11px,1.5vw,15px);border-radius:50%;background:#9BC46A;display:block;flex:0 0 auto"></span>Sitemap</p><h1 style="font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:clamp(1.9rem,1.2rem + 3vw,3.4rem);line-height:1.35;letter-spacing:.02em;color:#3A3428;margin:0">サイトマップ</h1><nav aria-label="パンくず" style="display:flex;flex-wrap:wrap;gap:0.6rem;align-items:center;font-family:'Noto Sans JP',sans-serif;font-weight:500;font-size:0.8rem;letter-spacing:0.06em;color:#6E6555;margin-top:clamp(1.4rem,3vw,2rem)"><a href="/" style="color:inherit;text-decoration:none">TOP</a><span aria-hidden="true" style="color:#9BC46A">／</span><span>サイトマップ</span></nav></div></section>
  <section data-screen-label="サイトマップ" style="background:#fff;padding:clamp(3.5rem,7vw,6rem) clamp(1.5rem,6vw,7rem) clamp(4.5rem,9vw,7rem)"><div style="max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(2rem,4vw,3rem)">
  <div><h2 style="font-family:'Zen Maru Gothic',sans-serif;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;font-size:0.92rem;color:#3F6B22;margin:0 0 1.2rem;padding-bottom:0.7rem;border-bottom:2px solid #3A3428">Service / 塗装について</h2><ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column"><li><a href="/menu" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">工事メニュー</a></li><li><a href="/price" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">料金の目安</a></li><li><a href="/blog/works" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">施工事例</a></li><li><a href="/consider" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">ご依頼を検討中の方へ</a></li></ul></div>
  <div><h2 style="font-family:'Zen Maru Gothic',sans-serif;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;font-size:0.92rem;color:#3F6B22;margin:0 0 1.2rem;padding-bottom:0.7rem;border-bottom:2px solid #3A3428">Company / 会社</h2><ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column"><li><a href="/" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">トップ</a></li><li><a href="/information" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">会社概要</a></li><li><a href="/blog" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">ブログ</a></li></ul></div>
  <div><h2 style="font-family:'Zen Maru Gothic',sans-serif;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;font-size:0.92rem;color:#3F6B22;margin:0 0 1.2rem;padding-bottom:0.7rem;border-bottom:2px solid #3A3428">Other / その他</h2><ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column"><li><a href="/form/inquiry" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">お問い合わせ</a></li><li><a href="/privacypolicy" style="display:flex;align-items:center;min-height:48px;text-decoration:none;color:#3A3428;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:0.98rem;padding:0.7rem 0 0.7rem 0;border-bottom:1px solid #EDE5D2" style-hover="color:#3F6B22">プライバシーポリシー</a></li></ul></div>
  </div></section>
  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3F6B22&quot;},&quot;beige&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#EDE5D2&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3A3428&quot;},&quot;mustard&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3F6B22&quot;},&quot;teal&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3A3428&quot;},&quot;textRevealSec&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1.4,&quot;min&quot;:0.6,&quot;max&quot;:2.6,&quot;step&quot;:0.1}}">
class Component extends DCLogic {
  componentDidMount() { this._setupReveal(); }

  _setupReveal() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const root = document.getElementById('top');
    if (!root) return;
    this._wave = 0;
    const targets = [];
    root.querySelectorAll('section, footer').forEach((sec) => {
      sec.querySelectorAll('h1,h2,h3,h4,h5,p,li,a[data-hov],dt,dd').forEach((el) => {
        if (el.dataset.rv) return;
        el.dataset.rv = '1';
        el.style.opacity = '0';
        el.style.filter = 'blur(8px)';
        el.style.transform = 'translateY(26px)';
        el.style.willChange = 'opacity, transform, filter';
        targets.push(el);
      });
    });
    this._revealTargets = targets;
    this._rio = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) this._reveal(en.target); });
    }, { threshold: 0.16, rootMargin: '0px 0px -7% 0px' });
    targets.forEach((el) => this._rio.observe(el));
    this._revealInView();
    this._onRevealScroll = () => this._revealInView();
    window.addEventListener('scroll', this._onRevealScroll, { passive: true });
    window.addEventListener('resize', this._onRevealScroll);
    this._revealSafety = setTimeout(() => { (this._revealTargets || []).forEach((el) => this._reveal(el)); }, 3500);
  }

  _revealInView() {
    const vh = window.innerHeight || 800;
    (this._revealTargets || []).forEach((el) => {
      if (el.dataset.rvDone) return;
      const r = el.getBoundingClientRect();
      if (r.top < vh * 0.92 && r.bottom > 0) this._reveal(el);
    });
  }

  _reveal(el) { if (el.dataset.rvDone) return; if (this._rio) this._rio.unobserve(el); this._playReveal(el); }

  _playReveal(el) {
    if (el.dataset.rvDone) return;
    el.dataset.rvDone = '1';
    const dur = this.props.textRevealSec ?? 1.4;
    el.style.animation = 'bleedReveal ' + dur + 's cubic-bezier(.22,.61,.36,1) ' + (this._wave * 0.08) + 's forwards';
    this._wave++;
    clearTimeout(this._waveT);
    this._waveT = setTimeout(() => { this._wave = 0; }, 240);
    el.addEventListener('animationend', () => { el.style.willChange = 'auto'; el.style.filter = 'none'; el.style.transform = 'none'; el.style.opacity = '1'; }, { once: true });
  }

  componentWillUnmount() {
    if (this._rio) this._rio.disconnect();
    if (this._onRevealScroll) { window.removeEventListener('scroll', this._onRevealScroll); window.removeEventListener('resize', this._onRevealScroll); }
    clearTimeout(this._revealSafety);
  }

  renderVals() {
    const accent = this.props.accent ?? '#3F6B22';
    const beige = this.props.beige ?? '#EDE5D2';
    const dark = this.props.dark ?? '#3A3428';
    const mustard = this.props.mustard ?? '#3F6B22';
    const teal = this.props.teal ?? '#3A3428';
    return {
      accent, beige, dark, mustard, teal,
      btnEnter: (e) => {
        const t = e.currentTarget; const d = t.dataset.hov;
        if (d === 'dark') { t.style.background = accent; }
        else if (d === 'light') { t.style.background = accent; t.style.color = '#fff'; t.style.borderColor = accent; }
        else if (d === 'teal') { t.style.background = teal; t.style.color = '#fff'; t.style.borderColor = teal; }
      },
      btnLeave: (e) => {
        const t = e.currentTarget; const d = t.dataset.hov;
        if (d === 'dark') { t.style.background = dark; }
        else if (d === 'light') { t.style.background = '#fff'; t.style.color = '#3A3428'; t.style.borderColor = '#fff'; }
        else if (d === 'teal') { t.style.background = 'transparent'; t.style.color = '#fff'; t.style.borderColor = 'rgba(255,255,255,0.7)'; }
      },
    };
  }
}
</script>
</body>
</html>
