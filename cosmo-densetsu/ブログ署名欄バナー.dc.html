<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
</helmet>
<div style="font-family:'Zen Kaku Gothic New',sans-serif;padding:clamp(1.2rem,4vw,2rem) 0">
  <a href="/form/inquiry" aria-label="お問い合わせページへ" style="display:flex;align-items:center;justify-content:space-between;gap:clamp(1.1rem,3vw,2.4rem);flex-wrap:wrap;max-width:920px;margin:0 auto;text-decoration:none;color:#fff;background:var(--accent,#A8456A);padding:clamp(1.6rem,3.6vw,2.4rem) clamp(1.6rem,4vw,2.8rem);position:relative;overflow:hidden;border-radius:999px;box-shadow:0 10px 30px rgba(226,150,174,0.22);transition:box-shadow .35s ease,filter .35s ease" style-hover="box-shadow:0 16px 40px rgba(226,150,174,0.34);filter:brightness(1.04)">
    <div style="position:absolute;inset:0;background:radial-gradient(130% 160% at 100% 0%,rgba(255,255,255,0.18) 0%,transparent 55%);pointer-events:none"></div>
    <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#2C6C7E 0%,#E296AE 100%)"></div>
    <div style="position:relative;display:flex;align-items:center;gap:clamp(1rem,2.6vw,1.6rem);min-width:0">
      <div role="img" aria-label="画像" style="height:clamp(48px,7vw,64px);width:auto;flex:0 0 auto;display:block;background:#DCEAF2;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,0.4) 0 12px,rgba(168,69,106,0.08) 12px 24px);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;letter-spacing:0.28em;text-transform:uppercase;font-size:0.78rem;color:#3C6C82">Image</div>
      <div style="display:flex;flex-direction:column;gap:0.4rem;min-width:0">
        <span style="font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:0.3em;text-transform:uppercase;font-size:0.7rem;color:rgba(255,255,255,0.78)">Contact</span>
        <span style="font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:clamp(1.05rem,0.95rem + 0.6vw,1.4rem);line-height:1.5;letter-spacing:0.02em">塗装のご相談・お見積りは、<wbr>お気軽にどうぞ。</span>
        <span style="font-weight:300;font-size:0.8rem;letter-spacing:0.1em;color:rgba(255,255,255,0.75)">株式会社エンジョイホーム</span>
      </div>
    </div>
    <span style="position:relative;flex:0 0 auto;display:inline-flex;align-items:center;gap:0.6rem;background:#fff;color:#00293B;font-family:'Outfit',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.14em;font-size:0.86rem;padding:0.9rem 1.8rem;border-radius:1px;white-space:nowrap">お問い合わせへ<span aria-hidden="true" style="font-family:'Zen Kaku Gothic New',sans-serif;font-size:1.05rem;line-height:1">→</span></span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:200}}"></script>
</body>
</html>
