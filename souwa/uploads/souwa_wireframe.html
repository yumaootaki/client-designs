<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株式会社総和 リプレイス ワイヤーフレーム（求人特化型・全14ページ）</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2F4E; --ice:#DCEBF3; --frost:#6FA8C7; --orange:#E8833A; --line:#06C755;
  --base:#F7FAFC; --ink:#1F2933; --gray:#D5DCE3; --gray2:#EEF2F5; --mute:#6B7785;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"BIZ UDPGothic",sans-serif;color:var(--ink);background:#E9EEF2;display:flex;min-height:100vh;font-size:15px;line-height:1.75}
aside{width:280px;flex-shrink:0;background:var(--navy);color:#fff;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
aside h1{font-family:"Zen Kaku Gothic New",sans-serif;font-size:16px;padding:0 20px 4px}
aside .sub{font-size:12px;opacity:.7;padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.15)}
aside .grp{font-size:11px;opacity:.6;padding:14px 20px 4px}
aside button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:#fff;font:inherit;font-size:13px;padding:7px 20px;cursor:pointer}
aside button .no{font-size:11px;opacity:.6;width:20px}
aside button .tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,.15)}
aside button .tag.new{background:var(--orange)}
aside button.on{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--orange)}
aside button:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
main{flex:1;padding:24px;overflow-x:auto}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.bar .ttl{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:20px;color:var(--navy)}
.bar .meta{font-size:12px;color:var(--mute)}
.bar .dev{margin-left:auto;display:flex;border:1px solid var(--gray);border-radius:4px;overflow:hidden}
.bar .dev button{border:0;background:#fff;padding:6px 14px;font:inherit;font-size:12px;cursor:pointer}
.bar .dev button.on{background:var(--navy);color:#fff}
.purpose{background:#fff;border-left:4px solid var(--orange);padding:12px 16px;font-size:13px;margin-bottom:16px;max-width:1200px}
.purpose b{color:var(--navy)}
.canvas{background:#fff;margin:0 auto;max-width:1200px;box-shadow:0 0 0 1px var(--gray);transition:max-width .25s}
.canvas.sp{max-width:390px}
/* 共通ヘッダー */
.hd{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--gray)}
.logo{width:150px;height:40px;border:1.5px dashed var(--frost);display:grid;place-items:center;font-size:11px;color:var(--frost)}
.gnav{display:flex;gap:16px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.hd .hcta{margin-left:auto;display:flex;gap:8px}
.pill{font-size:12px;padding:6px 12px;border-radius:999px;color:#fff;white-space:nowrap}
.pill.l{background:var(--line)} .pill.t{background:var(--orange)}
.sp .gnav,.sp .hd .hcta{display:none}
.sp .hd::after{content:"≡";margin-left:auto;font-size:22px;color:var(--navy)}
/* セクション */
.sec{position:relative;padding:36px 32px;border-bottom:1px dashed var(--gray)}
.sp .sec{padding:28px 16px}
.sec .lbl{position:absolute;top:8px;left:8px;font-size:10px;background:var(--navy);color:#fff;padding:1px 7px;border-radius:2px}
.sec h2{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:24px;color:var(--navy);line-height:1.45;margin:6px 0 10px;max-width:40em}
.sp .sec h2{font-size:20px}
.sec p.txt{max-width:44em;margin-bottom:14px}
.note{margin-top:14px;font-size:12px;background:#FFF6EE;border:1px solid #F4CFAE;color:#8A4A17;padding:8px 12px;border-radius:3px}
.note::before{content:"制作メモ：";font-weight:700}
.hero{background:var(--ice);padding:48px 32px}
.hero h2{font-size:34px;font-weight:900}
.sp .hero{padding:32px 16px}.sp .hero h2{font-size:24px}
.img{background:repeating-linear-gradient(45deg,var(--gray2),var(--gray2) 10px,#E3E9EE 10px,#E3E9EE 20px);border:1px solid var(--gray);min-height:180px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mute);padding:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.sp .grid{grid-template-columns:1fr}
.card{border:1px solid var(--gray);padding:16px;background:#fff}
.card b{display:block;color:var(--navy);margin-bottom:4px;font-family:"Zen Kaku Gothic New",sans-serif}
.card .ph{height:110px;margin:-16px -16px 12px;background:var(--gray2);display:grid;place-items:center;font-size:11px;color:var(--mute)}
table{border-collapse:collapse;width:100%;max-width:820px;margin-bottom:14px;font-size:14px}
th,td{border:1px solid var(--gray);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--gray2);width:30%;color:var(--navy);font-weight:700}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;counter-reset:s}
.steps div{flex:1;min-width:150px;border:1px solid var(--frost);padding:12px;background:#fff;counter-increment:s;font-size:14px}
.steps div::before{content:"STEP " counter(s);display:block;font-size:11px;color:var(--frost);font-weight:700}
.faq details{border-bottom:1px solid var(--gray);padding:12px 0;max-width:820px}
.faq summary{cursor:pointer;font-weight:700;color:var(--navy)}
.faq summary::before{content:"Q. ";color:var(--orange)}
.faq p{margin-top:6px;font-size:14px}
.faq p::before{content:"A. ";font-weight:700;color:var(--frost)}
.quote{border-left:4px solid var(--frost);background:var(--base);padding:14px 18px;margin-bottom:14px;max-width:44em;font-size:15px}
.quote small{display:block;color:var(--mute);margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs span{border:1px solid var(--navy);padding:4px 14px;font-size:13px;border-radius:3px}
.tabs span:first-child{background:var(--navy);color:#fff}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.facts span{background:#fff;border:1px solid var(--frost);padding:8px 14px;font-weight:700;color:var(--navy);font-size:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.btn{border:1.5px solid var(--navy);color:var(--navy);padding:10px 18px;font-size:14px;font-weight:700;background:#fff}
.cta{background:var(--navy);color:#fff;padding:28px 24px;text-align:center}
.cta h3{font-family:"Zen Kaku Gothic New",sans-serif;font-size:20px;margin-bottom:6px}
.cta p{font-size:13px;opacity:.85;margin-bottom:14px}
.cta .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta .b{padding:14px 22px;font-weight:700;border-radius:4px;min-width:220px}
.cta .b.l{background:var(--line)} .cta .b.t{background:var(--orange)} .cta .b.f{background:#fff;color:var(--navy)}
.ph-chk{color:#C0392B;font-weight:700}
.ft{background:var(--navy);color:#fff;padding:24px 32px;font-size:12px;opacity:.95}
.ft .cols{display:flex;gap:32px;flex-wrap:wrap;margin-bottom:10px}
.spbar{display:none}
.sp .spbar{display:flex;position:sticky;bottom:0;font-size:12px;font-weight:700;text-align:center}
.sp .spbar div{flex:1;padding:12px 4px;color:#fff}
@media (max-width:860px){body{flex-direction:column}aside{width:100%;height:auto;position:static}main{padding:12px}}
@media (prefers-reduced-motion:reduce){.canvas{transition:none}}
</style>
</head>
<body>
<aside>
  <h1>株式会社総和</h1>
  <div class="sub">求人特化型リプレイス<br>ワイヤーフレーム 全14ページ</div>
  <div id="nav"></div>
</aside>
<main>
  <div class="bar">
    <div class="ttl" id="ttl"></div>
    <div class="meta" id="meta"></div>
    <div class="dev"><button class="on" data-d="pc">PC</button><button data-d="sp">SP</button></div>
  </div>
  <div class="purpose" id="purpose"></div>
  <div class="canvas" id="canvas"></div>
</main>

const esc=s=>s.replace(/【要確認([^】]*)】/g,'<span class="ph-chk">【要確認$1】</span>');
function part(item){
  const i=item.indexOf(':');const t=i<0?item:item.slice(0,i);const v=i<0?'':item.slice(i+1);
  const rows=v.split(';;');
  switch(t){
    case 'img':return `<div class="img">画像：${esc(v)}</div>`;
    case 'cards':return `<div class="grid">${rows.map(r=>{const[a,b]=r.split('|');return `<div class="card"><b>${esc(a)}</b>${esc(b||'')}</div>`}).join('')}</div>`;
    case 'pcards':return `<div class="grid">${rows.map(r=>{const[a,b]=r.split('|');return `<div class="card"><div class="ph">写真</div><b>${esc(a)}</b>${esc(b||'')}</div>`}).join('')}</div>`;
    case 'table':return `<table>${rows.map(r=>{const[a,b]=r.split('|');return `<tr><th>${esc(a)}</th><td>${esc(b||'')}</td></tr>`}).join('')}</table>`;
    case 'steps':return `<div class="steps">${rows.map(r=>`<div>${esc(r)}</div>`).join('')}</div>`;
    case 'faq':return `<div class="faq">${rows.map(r=>{const[a,b]=r.split('|');return `<details><summary>${esc(a)}</summary><p>${esc(b)}</p></details>`}).join('')}</div>`;
    case 'quote':{const[a,b]=v.split('|');return `<div class="quote">「${esc(a)}」<small>${esc(b||'')}</small></div>`}
    case 'tabs':return `<div class="tabs">${rows.map(r=>`<span>${r}</span>`).join('')}</div>`;
    case 'facts':return `<div class="facts">${rows.map(r=>`<span>${r}</span>`).join('')}</div>`;
    case 'btns':return `<div class="btnrow">${rows.map(r=>`<span class="btn">${r}</span>`).join('')}</div>`;
    case 'cta':{const[a,b]=v?v.split('|'):['まずは話だけでも聞いてみませんか','応募前のご質問だけでも大丈夫です'];
      return `<div class="cta"><h3>${a}</h3><p>${b}</p><div class="row"><span class="b l">LINEで相談・応募する</span><span class="b t">求人ダイヤル 070-6965-8178</span><span class="b f">応募フォームへ</span></div></div>`}
  }return '';
}
function draw(p){
  document.getElementById('ttl').textContent=`${p.no}. ${p.name}`;
  document.getElementById('meta').textContent=`${p.kind}ページ ／ ${p.slug}`;
  document.getElementById('purpose').innerHTML=`<b>このページの役割：</b>${esc(p.purpose)}`;
  const nav=['求職者のみなさまへ','働く魅力','先輩紹介','1日の流れ','給与・休日','よくある質問','採用情報','会社概要'];
  let h=`<div class="hd"><div class="logo">ロゴ（2020年版CDR→SVG）</div><div class="gnav">${nav.map(n=>`<span>${n}</span>`).join('')}</div><div class="hcta"><span class="pill l">LINEで相談</span><span class="pill t">求人ダイヤル</span></div></div>`;
  p.secs.forEach(s=>{
    h+=`<section class="sec${s.hero?' hero':''}"><span class="lbl">${s.n}</span>`;
    if(s.h)h+=`<h2>${esc(s.h)}</h2>`;
    if(s.p)h+=`<p class="txt">${esc(s.p)}</p>`;
    (s.w||[]).forEach(w=>h+=part(w));
    if(s.note)h+=`<div class="note">${esc(s.note)}</div>`;
    h+=`</section>`;
  });
  h+=`<div class="ft"><div class="cols"><div><b>株式会社総和</b><br>千葉県印西市<br>求人ダイヤル 070-6965-8178</div><div>求人：求職者のみなさまへ／経験者の方へ／未経験の方へ／働く魅力／先輩紹介／1日の流れ／給与・休日／よくある質問／採用情報</div><div>会社：業務案内／会社概要／ブログ／お問い合わせ</div></div>© 株式会社総和</div>`;
  h+=`<div class="spbar"><div style="background:var(--line)">LINEで相談</div><div style="background:var(--orange)">電話する</div><div style="background:var(--navy)">応募フォーム</div></div>`;
  document.getElementById('canvas').innerHTML=h;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',+b.dataset.no===p.no));
  window.scrollTo(0,0);
}
const navEl=document.getElementById('nav');
['求人','会社'].forEach(g=>{
  navEl.insertAdjacentHTML('beforeend',`<div class="grp">${g==='求人'?'求人ページ':'会社ページ'}</div>`);
  PAGES.filter(p=>p.grp===g).forEach(p=>navEl.insertAdjacentHTML('beforeend',`<button data-no="${p.no}"><span class="no">${p.no}</span>${p.name}<span class="tag ${p.kind==='新規'?'new':''}">${p.kind}</span></button>`));
});
navEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)draw(PAGES.find(p=>p.no==b.dataset.no))});
document.querySelectorAll('.dev button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.dev button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('canvas').classList.toggle('sp',b.dataset.d==='sp');
}));
draw(PAGES[0]);
</script>
