<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>button{margin:0;border:0;background:none;font:inherit;cursor:pointer;color:inherit}</style>
</helmet>
<div>
<header style="position:fixed;top:0;left:0;right:0;z-index:120;background:#06306E;transition:box-shadow .4s ease">
  <sc-if value="{{ scrolled }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;box-shadow:0 6px 28px rgba(0,0,0,.28);pointer-events:none"></div>
  </sc-if>
  <div style="position:relative;max-width:1440px;margin:0 auto;padding:0 clamp(16px,4vw,48px);height:clamp(64px,8vw,86px);display:flex;align-items:center;justify-content:space-between;gap:20px">
    <a href="/" aria-label="株式会社ユウシン工業 トップへ" style="display:flex;align-items:center;flex:none;background:#fff;border-radius:4px;padding:6px 10px;min-height:44px"><img src="assets/logo.png" alt="株式会社ユウシン工業" style="height:clamp(28px,3.4vw,38px);width:auto;display:block"></a>

    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインナビゲーション" style="display:flex;align-items:center;gap:clamp(8px,1.4vw,22px)">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
          <div style="position:relative" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ item.onLeave }}">
            <a href="{{ item.href }}" style="{{ item.linkStyle }}">
              <span>{{ item.label }}</span>
              <sc-if value="{{ item.hasChildren }}" hint-placeholder-val="{{ false }}">
                <span aria-hidden="true" style="font-size:9px;opacity:.8">▼</span>
              </sc-if>
            </a>
            <sc-if value="{{ item.open }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:10px">
                <div style="background:#06306E;border-top:3px solid #3D8BFF;min-width:180px;box-shadow:0 18px 40px rgba(0,0,0,.3);padding:8px 0">
                  <sc-for list="{{ item.children }}" as="c" hint-placeholder-count="2">
                    <a href="{{ c.href }}" style="display:block;color:#fff;font-weight:500;font-size:14px;padding:11px 22px;white-space:nowrap" style-hover="color:#0A4DB3;text-decoration:underline;text-underline-offset:4px">{{ c.label }}</a>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <a href="https://lin.ee/8Wcjh7g" style="background:#06C755;color:#fff;font-weight:900;font-size:14px;padding:12px 18px;border-radius:4px;display:flex;align-items:center;gap:6px;margin-left:6px;min-height:44px;white-space:nowrap" style-hover="opacity:.88">LINEで質問</a>
        <a href="/recruit#apply" style="background:#F07A28;color:#1F2933;font-weight:900;font-size:14px;padding:12px 20px;border-radius:4px;display:flex;align-items:center;gap:8px;min-height:44px;white-space:nowrap" style-hover="background:#D9661A">応募する<span aria-hidden="true">→</span></a>
      </nav>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="メニューを開く" aria-expanded="{{ menuOpen }}" style="width:48px;height:48px;background:#3D8BFF;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px">
        <span style="width:26px;height:2px;background:#06306E;display:block"></span>
        <span style="width:26px;height:2px;background:#06306E;display:block"></span>
        <span style="width:26px;height:2px;background:#06306E;display:block"></span>
      </button>
    </sc-if>
  </div>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:130;background:#06306E;overflow-y:auto;padding:18px clamp(18px,6vw,40px) 60px">
    <div style="display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:18px">
      <span style="display:flex;background:#fff;border-radius:4px;padding:6px 10px"><img src="assets/logo.png" alt="株式会社ユウシン工業" style="height:30px;width:auto;display:block"></span>
      <button onClick="{{ closeMenu }}" aria-label="メニューを閉じる" style="width:48px;height:48px;background:#F07A28;color:#1F2933;font-size:30px;display:flex;align-items:center;justify-content:center">✕</button>
    </div>
    <nav aria-label="メインナビゲーション">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
        <div style="border-bottom:1px solid rgba(255,255,255,.12)">
          <div style="display:flex;align-items:stretch">
            <a href="{{ item.href }}" style="flex:1;color:#fff;font-weight:700;font-size:17px;padding:18px 4px;min-height:44px">{{ item.label }}</a>
            <sc-if value="{{ item.hasChildren }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ item.onToggleAcc }}" aria-label="{{ item.label }}のサブメニュー" aria-expanded="{{ item.accOpen }}" style="width:56px;color:#0A4DB3;font-size:18px;display:flex;align-items:center;justify-content:center">
                <sc-if value="{{ item.accOpen }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">−</span></sc-if>
                <sc-if value="{{ item.accClosed }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true">＋</span></sc-if>
              </button>
            </sc-if>
          </div>
          <sc-if value="{{ item.accOpen }}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 0 14px 16px">
              <sc-for list="{{ item.children }}" as="c" hint-placeholder-count="2">
                <a href="{{ c.href }}" style="display:block;color:rgba(255,255,255,.82);font-size:15px;font-weight:500;padding:12px 8px;min-height:44px">— {{ c.label }}</a>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </nav>
    <a href="/recruit#apply" style="margin-top:26px;background:#F07A28;color:#1F2933;font-weight:900;font-size:17px;padding:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px">応募する<span aria-hidden="true">→</span></a>
    <a href="https://lin.ee/8Wcjh7g" style="margin-top:12px;background:#06C755;color:#fff;font-weight:900;font-size:17px;padding:16px;border-radius:4px;display:flex;align-items:center;justify-content:center">LINEで質問だけでもOK</a>
    <a href="tel:042-978-6466" style="margin-top:12px;border:1px solid rgba(255,255,255,.3);border-radius:4px;color:#fff;padding:14px;display:flex;flex-direction:column;align-items:center;line-height:1.3">
      <span style="font-weight:900;font-size:24px;letter-spacing:.02em">042-978-6466</span>
      <span style="font-size:12px;opacity:.8">受付 8:00〜17:00（土日休み）</span>
    </a>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;86px&quot;},&quot;active&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    vw: (typeof window !== 'undefined' ? window.innerWidth : 1280),
    scrolled: false,
    menuOpen: false,
    openNav: null,
    acc: null,
  };
  componentDidMount() {
    this._onScroll = () => { const s = window.scrollY > 20; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this._onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('scroll', this._onScroll, { passive: true });
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
  }
  renderVals() {
    const vw = this.state.vw;
    const isMobile = vw < 1200;
    const active = this.props.active || '';
    const openNav = this.state.openNav;
    const acc = this.state.acc;
    const NAV = [
      { label: '求職者のみなさまへ', href: '/recruit/message', children: [
        { label: '未経験から一人前まで', href: '/recruit/career' },
        { label: '働く環境・待遇', href: '/recruit/environment' },
        { label: '採用情報（募集要項・応募）', href: '/recruit' },
      ] },
      { label: '1日の流れ', href: '/recruit/day' },
      { label: 'スタッフ紹介', href: '/recruit/staff' },
      { label: '業務案内', href: '/work' },
      { label: '施工実績', href: '/blog-ex/instance' },
      { label: '会社概要', href: '/information', children: [
        { label: 'ユウシン工業について', href: '/about' },
        { label: 'ブログ', href: '/blog' },
        { label: 'お問い合わせ', href: '/form/inquiry' },
      ] },
      { label: 'よくある質問', href: '/faq' },
    ];
    const navItems = NAV.map((n, i) => {
      const isActive = active === n.href || (n.children && n.children.some((c) => c.href === active));
      return {
        label: n.label, href: n.href, children: n.children || [], hasChildren: !!(n.children && n.children.length),
        open: openNav === i && !!(n.children && n.children.length), accOpen: acc === i, accClosed: acc !== i,
        linkStyle: { display: 'flex', alignItems: 'center', gap: '5px', color: isActive ? '#9CC4FF' : '#fff', fontWeight: 700, fontSize: '14px', letterSpacing: '.02em', padding: '10px 4px', whiteSpace: 'nowrap', borderBottom: (isActive && n.children && n.children.length) ? '2px solid #3D8BFF' : '2px solid transparent' },
        onEnter: () => this.setState({ openNav: i }),
        onLeave: () => this.setState({ openNav: null }),
        onToggleAcc: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ acc: acc === i ? null : i }); },
      };
    });
    return {
      isMobile, isDesktop: !isMobile, scrolled: this.state.scrolled, menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false, acc: null }),
      navItems,
    };
  }
}
</script>
</body>
</html>
