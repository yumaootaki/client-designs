<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0A4DB3"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="20" font-weight="900" fill="#3D8BFF" text-anchor="middle">YUSHIN</text></svg></template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="image-slot.js"></script>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#1F2933;background:#fff;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
span.line-chunk{display:inline-block;overflow-wrap:anywhere;word-break:normal}
:focus-visible{outline:3px solid #F07A28;outline-offset:3px}
section a,section button,footer a,footer button{transition:opacity .2s ease}
section a:hover,section button:hover,footer a:hover,footer button:hover{opacity:.78}
/* ===== 施工実績 一覧 parts228系（add.css基礎）===== */
.parts228_section{background:#fff;padding:clamp(48px,7vw,90px) clamp(20px,5vw,64px) clamp(72px,11vw,140px)}
.parts228_wrap{max-width:1240px;margin:0 auto}
.parts228_filter{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 32px;padding:0}
.parts228_filter_item{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border:1px solid rgba(10,77,179,.3);border-radius:999px;background:#fff;color:#0A4DB3;text-decoration:none;font-size:15px;font-weight:700;line-height:1.4}
.parts228_filter_item:hover{border-color:#0A4DB3}
.parts228_filter_item:focus-visible{outline:2px solid #3D8BFF;outline-offset:2px}
.parts228_filter_item.is-active{background:#0A4DB3;border-color:#0A4DB3;color:#fff;font-weight:900}
.parts228_post_list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(20px,3vw,36px)}
.parts228_post_wrap{background:#fff;box-shadow:0 14px 34px rgba(6,48,110,.10);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.parts228_post_wrap:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(6,48,110,.18)}
.parts228_post_img{position:relative;overflow:hidden}
.parts228_post_img a{display:block}
.parts228_post_img img,.parts228_post_img image-slot{width:100%;height:240px;object-fit:cover;display:block}
.parts228_post_status{padding:16px 18px 0}
.parts228_post_date{font-family:"Noto Sans JP",sans-serif;letter-spacing:.04em;color:#0A4DB3;font-size:14px}
.parts228_post_title-excerpt{padding:8px 18px 20px}
.parts228_post_title{margin:0;font-weight:700;font-size:clamp(15px,2.2vw,17px);line-height:1.6;color:#1F2933}
.parts-blog-ex-tag_wrap{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 18px;margin:0;list-style:none}
.parts-blog-ex_tag{background:#EEF4FC;color:#0A4DB3;font-size:12px;font-weight:700;padding:5px 12px}
.parts228_pagenation{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:clamp(40px,6vw,64px);list-style:none;padding:0}
.parts228_pagenation a,.parts228_pagenation span{display:flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 12px;font-weight:700;border:1px solid rgba(10,77,179,.3);color:#0A4DB3}
.parts228_pagenation .pagination_num.current{background:#0A4DB3;color:#fff;border-color:#0A4DB3}
.parts228_pagenation a:hover{background:#EEF4FC}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
</style>
</helmet>

<div data-screen-label="施工実績" style="position:relative">

<dc-import name="SiteHeader" active="/blog-ex/instance" hint-size="100%,0"></dc-import>

<!-- ===== 下層ヘッダー（静的・自由）===== -->
<section style="position:relative;background:#06306E;color:#fff;overflow:hidden;padding:calc(clamp(64px,8vw,86px) + clamp(52px,8vw,96px)) clamp(20px,5vw,64px) clamp(52px,8vw,96px)">
  <img src="assets/subhero.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
  <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(105deg,rgba(6,48,110,.92),rgba(6,48,110,.62) 60%,rgba(6,48,110,.34))"></div>
  <div style="position:relative;max-width:1240px;margin:0 auto">
    <nav aria-label="パンくず" style="font-size:13px;color:rgba(255,255,255,.7);margin-bottom:18px"><a href="/" style="color:rgba(255,255,255,.7)">トップ</a> ／ <span style="color:#fff">施工実績</span></nav>
    <span style="font-family:'Noto Sans JP',sans-serif;font-weight:900;color:rgba(255,255,255,.55);font-size:clamp(12px,2vw,15px);letter-spacing:.18em">WORKS</span>
    <h1 style="margin:6px 0 0;font-weight:900;font-size:clamp(2.1rem,6vw,4rem);line-height:1.2">施工実績</h1>
    <p style="margin:18px 0 0;font-size:clamp(15px,2.4vw,19px);font-weight:700;color:rgba(255,255,255,.92);line-height:1.7"><span class="line-chunk">鉄道・高速道路・橋脚・浄水場。</span><span class="line-chunk">ユウシン工業が携わった公共構造物の鉄筋工事です。</span></p>
  </div>
</section>

<!-- ===== 動的：施工実績一覧（parts228系・CMS出力／作り直さない）===== -->
<!-- 🔒 CMS固定領域（parts228系）：構造/クラス/input name 変更禁止・承認/解除なし。見た目はadd.cssのみ -->
<!-- 🔒 LOCK START -->
<section class="parts228_section">
  <div class="parts228_wrap">
    <main class="parts228_main">
      <nav class="parts228_filter">
        <a class="parts228_filter_item is-active" href="/blog-ex/instance">すべて</a>
        <sc-for list="{{ tags }}" as="t" hint-placeholder-count="5">
          <a class="parts228_filter_item" href="/blog-ex/instance/tag/">{{ t }}</a>
        </sc-for>
      </nav>
      <ul class="parts228_post_list">
        <!-- CMS LOOP START -->
        <sc-for list="{{ posts }}" as="p" hint-placeholder-count="6">
          <li class="parts228_post_wrap">
            <div class="parts228_post_img">
              <a href="#"><image-slot id="{{ p.slot }}" style="width:100%;height:240px" shape="rect" fit="cover" placeholder="{{ p.slotLabel }}"></image-slot></a>
            </div>
            <div class="parts228_post_status">
              <span class="parts228_post_date">{{ p.date }}</span>
            </div>
            <div class="parts228_post_title-excerpt">
              <h3 class="parts228_post_title">{{ p.title }}</h3>
            </div>
            <ul class="parts-blog-ex-tag_wrap">
              <li class="parts-blog-ex_tag">{{ p.tag1 }}</li>
              <li class="parts-blog-ex_tag">{{ p.tag2 }}</li>
            </ul>
          </li>
        </sc-for>
        <!-- CMS LOOP END -->
      </ul>
      <ul class="parts228_pagenation">
        <li><span class="pagination_prev">&lt;&lt;</span></li>
        <li><span class="pagination_num current">1</span></li>
        <li><a class="pagination_num" href="#">2</a></li>
        <li><a class="pagination_num" href="#">3</a></li>
        <li><a class="pagination_next" href="#">&gt;&gt;</a></li>
      </ul>
    </main>
  </div>
</section>
<!-- 🔒 LOCK END -->

<section style="background:#EEF4FC;padding:clamp(48px,7vw,88px) clamp(20px,5vw,64px)"><div style="max-width:1200px;margin:0 auto"><!-- 要取材：実績ごとの場所・規模・担当工程・ひとこと／掲載できる現場・写真の範囲 --><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(14px,2vw,20px)"><div style="background:#0A4DB3;color:#fff;border-radius:4px;padding:clamp(22px,3vw,30px) clamp(20px,3vw,34px);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between"><p style="margin:0;font-weight:900;font-size:clamp(16px,2.4vw,20px)">この現場で一緒に働きませんか</p><a href="/recruit/message" style="display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:14px 28px;border-radius:4px;background:#F07A28;color:#1F2933;font-weight:900;font-size:15px" style-hover="background:#D9661A">求職者のみなさまへ<span aria-hidden="true">→</span></a></div><div style="background:#0A4DB3;color:#fff;border-radius:4px;padding:clamp(22px,3vw,30px) clamp(20px,3vw,34px);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between"><p style="margin:0;font-weight:900;font-size:clamp(16px,2.4vw,20px)">工事のご相談</p><a href="/form/inquiry" style="display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 24px;border-radius:4px;border:2px solid #fff;color:#fff;font-weight:900;font-size:15px" style-hover="background:#fff;color:#0A4DB3">お問い合わせ<span aria-hidden="true">→</span></a></div></div></div></section>

<dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      tags: ['鉄道', '高速道路', '橋脚・耐震補強', '浄水場・ポンプ場'],
      // CMS（施工実績）出力のダミー。実データはCMSで置換される
      posts: [
        { slot: 'work-post-1', slotLabel: '施工写真：高速道路', date: '0000.00.00', title: '高速道路 床版の鉄筋工事', tag1: '高速道路', tag2: '関東一円' },
        { slot: 'work-post-2', slotLabel: '施工写真：橋脚', date: '0000.00.00', title: '橋脚の鉄筋工事', tag1: '橋脚・耐震補強', tag2: '関東一円' },
        { slot: 'work-post-3', slotLabel: '施工写真：浄水場', date: '0000.00.00', title: '浄水場の壁・床の鉄筋工事', tag1: '浄水場・ポンプ場', tag2: '関東一円' },
        { slot: 'work-post-4', slotLabel: '施工写真：鉄道', date: '0000.00.00', title: '鉄道高架橋の鉄筋工事', tag1: '鉄道', tag2: '関東一円' },
      ],
    };
  }
}
</script>
</body>
</html>
