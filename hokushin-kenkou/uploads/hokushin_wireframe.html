<html lang="ja">
<head>

<title>株式会社北新建工 リニューアル ワイヤーフレーム(全14P・コピー入り)</title>
<style>

  }
  *{box-sizing:border-box;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);margin:0;background:var(--paper);}

  .tabbar button.active{background:var(--slate);color:#fff;font-weight:bold;}
  .tabbar button:hover{background:#204264;}
  .page{display:none;max-width:1000px;margin:0 auto;padding:24px 16px 60px;}
  .page.active{display:block;}
  .pagetitle{font-size:11px;color:var(--sub);letter-spacing:.05em;margin-bottom:4px;}
  h1.wf{font-size:20px;margin:0 0 6px;border-bottom:2px solid var(--navy);padding-bottom:8px;}
  .metanote{background:#fff3cd;border:1px solid #e0c26b;color:#7a5b00;font-size:11px;padding:6px 10px;margin-bottom:16px;}
  .block{border:1px solid var(--sky);background:#fff;margin-bottom:14px;padding:16px;}
  .label{font-size:11px;color:var(--sub);margin-bottom:8px;font-weight:bold;border-left:3px solid var(--slate);padding-left:6px;}
  .imgbox{background:var(--sky);border:1px dashed var(--slate);text-align:center;color:var(--sub);font-size:12px;padding:24px 8px;}
  .imgbox.tall{padding:50px 8px;}
  .copy{background:#fff;}
  .headline{font-size:19px;font-weight:bold;color:var(--navy);line-height:1.5;margin:0 0 8px;}
  .subhead{font-size:14px;color:var(--slate);margin:0 0 10px;line-height:1.6;}
  .body-text{font-size:13px;line-height:1.9;margin:0 0 6px;}
  .cta-btn{display:inline-block;background:var(--navy);color:#fff;font-size:12px;padding:8px 18px;margin-right:8px;margin-top:6px;}
  .cta-btn.brass{background:var(--brass);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:150px;}
  .row3 > div{flex:1 1 30%;}
  .row4 > div{flex:1 1 22%;}

  .nav-wf .items span.hot{background:var(--brass);color:#2a2100;border-color:var(--brass);font-weight:bold;}
  .nav-wf .cta{background:var(--brass);color:#2a2100;padding:6px 14px;font-weight:bold;}
  .footer-wf{border:1px solid var(--navy);background:var(--navy);color:#dfe8ef;padding:16px;font-size:11px;margin-top:20px;}
  .footer-wf .row div{background:rgba(255,255,255,.06);border:1px solid #33526f;padding:6px;text-align:center;}

  .card .img{background:var(--sky);height:80px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:10px;border:1px dashed var(--slate);}

  .accordion{border:1px solid var(--sky);background:#fff;margin-bottom:8px;padding:0;}
  .accordion .q{display:flex;justify-content:space-between;background:var(--sky);padding:10px 12px;font-size:13px;font-weight:bold;color:var(--navy);}
  .accordion .a{padding:10px 12px;font-size:12px;line-height:1.8;}
  table.priceTbl{width:100%;border-collapse:collapse;font-size:12px;}
  table.priceTbl th,table.priceTbl td{border:1px solid var(--sky);padding:10px;text-align:left;}
  table.priceTbl th{background:var(--navy);color:#fff;}
  table.priceTbl td.price{color:var(--brass);font-weight:bold;}
  .compareTbl{width:100%;border-collapse:collapse;font-size:12px;}
  .compareTbl th,.compareTbl td{border:1px solid var(--sky);padding:10px;text-align:center;vertical-align:top;}
  .compareTbl th{background:var(--navy);color:#fff;}
  .compareTbl td.us{background:#eef4f9;font-weight:bold;color:var(--navy);}
  .timeline{border-left:3px solid var(--navy);margin-left:10px;padding-left:18px;}
  .timeline .yr{background:#fff;border:1px solid var(--sky);padding:10px 12px;margin-bottom:14px;font-size:12px;}
  .timeline .yr b{color:var(--navy);}
  .staffcard{border:1px solid var(--sky);background:#fff;padding:16px;margin-bottom:14px;}
  .staffcard .head{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px;}
  .staffcard .photo{width:90px;height:90px;background:var(--sky);border:1px dashed var(--slate);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);}
  .staffcard .name{font-size:15px;color:var(--navy);font-weight:bold;}
  .staffcard .role{font-size:12px;color:var(--slate);}
  .note{font-size:11px;color:#b33;margin-top:4px;}
  .step-flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .flowstep{background:var(--sky);border:1px solid var(--slate);padding:10px;text-align:center;font-size:11px;flex:1;min-width:100px;color:var(--navy);font-weight:bold;}
  .arrow{align-self:center;font-size:16px;color:var(--slate);}

</head>

{id:"staff", label:"④ スタッフ紹介", title:"④スタッフ紹介(仮想人物・たたき台)", content: `
  <div class="metanote">※実在スタッフの情報が未確定のため、以下は仮想人物による長文プロフィールのたたき台です。文章量・トーンの「型」として扱い、実データ確定後に差し替えてください。</div>
  <div class="block copy"><div class="label">ヒーロー</div>
    <div class="headline">現場を支える、北新建工のスタッフをご紹介します</div>
    <p class="body-text">お客様の大切な住まいを預かる仕事だからこそ、一人ひとりが責任と誇りを持って現場に立っています。</p>
  </div>
  <div class="block copy"><div class="label">代表メッセージ</div>
    <div class="staffcard">
      <div class="head"><div class="photo">代表写真</div><div><div class="name">代表取締役 北山 建一(仮名)</div><div class="role">代表取締役社長</div></div></div>
      <p class="body-text">昭和42年の創業以来、上尾市を中心に多くのお客様の「暮らし」に携わらせていただきました。工事は決して安い買い物ではありません。だからこそ、私たちは「顔の見える会社」であり続けたいと考えています。下請けに任せきりにせず、自社の職人が最後まで責任を持つ。それが北新建工のものづくりです。これからも地域の皆様に信頼していただける会社を目指し、社員一同、日々技術を磨いてまいります。どうぞお気軽にご相談ください。</p>
    </div>
  </div>
  <div class="block"><div class="label">スタッフ一覧(長文プロフィール)</div>
    <div class="staffcard">
      <div class="head"><div class="photo">写真</div><div><div class="name">工事部長 田村 誠(仮名)・52歳</div><div class="role">現場責任者/勤続28年</div></div></div>
      <p class="body-text">入社28年、現場一筋のベテランです。若手時代は新築工事の大工として腕を磨き、ここ10年は水回りリフォームを中心とした現場管理を担当しています。「工事は段取りが8割」が口癖で、事前の現地調査を人一倍丁寧に行うことで知られています。近隣への挨拶回りも自ら率先して行い、「工事中、ご近所トラブルを一件も起こしたことがない」ことが密かな誇りです。休日は釣りが趣味で、現場でもお客様との会話のきっかけになることも。</p>
    </div>
    <div class="staffcard">
      <div class="head"><div class="photo">写真</div><div><div class="name">大工職人 小林 一輝(仮名)・41歳</div><div class="role">大工・水回りリフォーム担当/勤続15年</div></div></div>
      <p class="body-text">建築系専門学校を卒業後、北新建工一筋で15年。木造住宅の構造を熟知しており、リフォーム時に発見される下地の傷みなどにもすぐに対応できる知識と技術を持っています。「見えなくなる部分ほど丁寧に」を信条に、床下や壁の中の施工にも手を抜きません。フローリング張替えの技術指導も担当し、若手の育成にも力を入れています。二児の父で、子育て世代のお客様の「暮らしやすさ」への視点にも定評があります。</p>
    </div>
    <div class="staffcard">
      <div class="head"><div class="photo">写真</div><div><div class="name">若手職人 佐藤 蓮(仮名)・26歳</div><div class="role">大工見習い/勤続4年</div></div></div>
      <p class="body-text">未経験からこの世界に入り、4年目。最初は道具の名前を覚えるところからのスタートでしたが、先輩たちの丁寧な指導のもと、着実に現場での経験を積んでいます。「お客様から直接『ありがとう』と言っていただけるのがこの仕事の一番の魅力」と話す、まっすぐな性格の持ち主。フローリング張替えや小規模な内装工事を任されることが増え、日々成長を実感しているところです。将来は水回りリフォームの現場を一人で任せられる職人を目指しています。</p>
    </div>
  </div>
  <div class="block copy"><div class="label">資格・体制</div><p class="body-text">2級建築施工管理技士、木造建築士などの有資格者が在籍。現場責任者を中心に、施工品質と安全管理を徹底する体制を整えています。</p></div>
  <div class="block copy"><div class="label">採用情報への誘導</div><div class="headline" style="font-size:15px;">一緒に働く仲間を募集しています</div><a class="cta-btn">採用情報を見る</a></div>
`},

{id:"faq", label:"⑤ FAQ", title:"⑤よくある質問", content: `

    <p class="body-text">一覧・詳細フォーマットは維持。週1回以上の更新(施工実績+コラム、5,000字程度)を継続し、カテゴリタグに「水回りリフォーム」「フローリング張替え」「新築工事」等を整備してSEO面でも回遊しやすくする。</p>

`},
];

const tabbar = document.getElementById('tabbar');
const pagesDiv = document.getElementById('pages');

pages.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.textContent = p.label;
  btn.onclick = () => showPage(i);
  btn.id = 'tab-' + p.id;
  tabbar.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'page';
  div.id = 'page-' + p.id;
  div.innerHTML = `<div class="pagetitle">株式会社北新建工 / ワイヤーフレーム</div><h1 class="wf">${p.title}</h1>${p.content}`;
  pagesDiv.appendChild(div);
});

function showPage(i){
  pages.forEach((p, j) => {
    document.getElementById('page-'+p.id).classList.toggle('active', i===j);
    document.getElementById('tab-'+p.id).classList.toggle('active', i===j);
  });
  window.scrollTo(0,0);
}
showPage(0);
</script>
</body>
