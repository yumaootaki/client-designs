<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
</helmet>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;padding:clamp(8px,1.4vw,16px) clamp(10px,2.4vw,24px);pointer-events:none">
  <div style="pointer-events:auto;max-width:1320px;margin:0 auto;min-height:64px;padding:8px clamp(12px,2vw,20px);background:#fff;border-radius:clamp(22px,3vw,40px);box-shadow:0 10px 30px rgba(0,57,83,.10);display:flex;align-items:center;justify-content:space-between;gap:14px;font-family:'Zen Kaku Gothic New',sans-serif;color:#00293B">
    <a href="/" aria-label="有限会社協進建設 トップへ" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;flex-shrink:0;min-height:44px">
      <img src="images/logo-mark.png" alt="" style="display:block;width:clamp(34px,5vw,42px);height:auto;flex:0 0 auto">
      <span style="display:flex;flex-direction:column;line-height:1;width:max-content">
        <span style="font-weight:900;font-size:clamp(1rem,2.6vw,1.18rem);letter-spacing:0.06em;white-space:nowrap;color:#00293B">有限会社協進建設</span>
        <span style="font-family:'Outfit',sans-serif;font-weight:600;font-size:0.6rem;letter-spacing:0.2em;margin-top:5px;color:#1F63B5;white-space:nowrap">KYOSHIN KENSETSU</span>
      </span>
    </a>
    <sc-if value="{{ showDesktopNav }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="メインメニュー" style="display:flex;align-items:center;gap:2px">
        <a href="/recruit" style="padding:10px 11px;font-size:14px;font-weight:700;color:#00293B;text-decoration:none;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s" style-hover="background:#E8F3FC;color:#1F63B5">求職者のみなさまへ</a>
        <a href="/recruit/job" style="padding:10px 11px;font-size:14px;font-weight:500;color:#00293B;text-decoration:none;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s" style-hover="background:#E8F3FC;color:#1F63B5">仕事を知る</a>
        <a href="/recruit/requirements" style="padding:10px 11px;font-size:14px;font-weight:500;color:#00293B;text-decoration:none;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s" style-hover="background:#E8F3FC;color:#1F63B5">募集要項・FAQ</a>
        <a href="/information" style="padding:10px 11px;font-size:14px;font-weight:500;color:#00293B;text-decoration:none;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s" style-hover="background:#E8F3FC;color:#1F63B5">協進建設について</a>
        <a href="/blog" style="padding:10px 11px;font-size:14px;font-weight:500;color:#00293B;text-decoration:none;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s" style-hover="background:#E8F3FC;color:#1F63B5">ブログ</a>
        <a href="/recruit/requirements#entry" style="margin-left:8px;min-height:44px;display:flex;align-items:center;padding:0 20px;background:#1F63B5;color:#fff;font-size:14px;font-weight:700;text-decoration:none;border-radius:999px;white-space:nowrap;transition:opacity .3s" style-hover="opacity:0.85">応募・見学</a>
        <a href="/form/inquiry" style="margin-left:6px;min-height:44px;display:flex;align-items:center;padding:0 18px;background:#fff;border:2px solid #CFE2F4;color:#00293B;font-size:14px;font-weight:700;text-decoration:none;border-radius:999px;white-space:nowrap;transition:border-color .3s" style-hover="border-color:#1F63B5">お問い合わせ</a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggleMenu }}" aria-label="{{ burgerLabel }}" aria-expanded="{{ menuOpen }}" style="position:relative;z-index:80;width:48px;height:48px;border:1px solid #CFE2F4;border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;flex-shrink:0">
        <span aria-hidden="true" style="width:20px;height:2px;display:block;border-radius:2px;background:#00293B"></span>
        <span aria-hidden="true" style="width:20px;height:2px;display:block;border-radius:2px;background:#00293B"></span>
        <span aria-hidden="true" style="width:20px;height:2px;display:block;border-radius:2px;background:#5FA8E6"></span>
      </button>
    </sc-if>
  </div>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:45;font-family:'Zen Kaku Gothic New',sans-serif">
    <div onClick="{{ closeMenu }}" style="position:absolute;inset:0;background:rgba(0,41,59,.32)"></div>
    <nav aria-label="メインメニュー" style="position:absolute;top:calc(64px + 2 * clamp(8px,1.4vw,16px));left:clamp(10px,2.4vw,24px);right:clamp(10px,2.4vw,24px);max-height:calc(100svh - 64px - 4 * clamp(8px,1.4vw,16px) - 64px);overflow-y:auto;background:#fff;border-radius:clamp(22px,3vw,32px);box-shadow:0 24px 60px rgba(0,57,83,.18);padding:clamp(18px,4vw,28px)">
      <span style="display:block;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;letter-spacing:.22em;color:#1F63B5;margin-bottom:10px">MENU</span>
      <div style="display:flex;flex-direction:column">
        <a href="/" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:48px;padding:11px 6px;font-size:15px;font-weight:700;color:#00293B;text-decoration:none;border-bottom:1px solid #E3EEF8">TOP</a>
        <a href="/recruit" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:48px;padding:11px 6px;font-size:15px;font-weight:700;color:#00293B;text-decoration:none;border-bottom:1px solid #E3EEF8">求職者のみなさまへ</a>
        <a href="/recruit/job" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:48px;padding:11px 6px;font-size:15px;font-weight:700;color:#00293B;text-decoration:none;border-bottom:1px solid #E3EEF8">仕事を知る</a>
        <a href="/recruit/requirements" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:48px;padding:11px 6px;font-size:15px;font-weight:700;color:#00293B;text-decoration:none;border-bottom:1px solid #E3EEF8">募集要項・よくある質問</a>
        <a href="/information" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:48px;padding:11px 6px;font-size:15px;font-weight:700;color:#00293B;text-decoration:none;border-bottom:1px solid #E3EEF8">協進建設について</a>
        <a href="/blog" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:48px;padding:11px 6px;font-size:15px;font-weight:700;color:#00293B;text-decoration:none;border-bottom:1px solid #E3EEF8">ブログ</a>
        <a href="/form/inquiry" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:48px;padding:11px 6px;font-size:15px;font-weight:700;color:#00293B;text-decoration:none;border-bottom:1px solid #E3EEF8">お問い合わせ</a>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-top:clamp(14px,2.6vw,22px)">
        <a href="/recruit/requirements#entry" onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:center;min-height:50px;padding:12px;background:#1F63B5;color:#fff;font-weight:700;font-size:15px;text-decoration:none;border-radius:999px">応募・見学を申し込む</a>
        <a href="tel:0358515790" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px;background:#fff;border:2px solid #CFE2F4;color:#00293B;font-weight:700;font-size:15px;text-decoration:none;border-radius:999px">電話 <span style="font-family:'Outfit',sans-serif;letter-spacing:.06em">03-5851-5790</span></a>
      </div>
    </nav>
  </div>
</sc-if>

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:10px;right:10px;bottom:10px;z-index:44;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px;font-family:'Zen Kaku Gothic New',sans-serif">
    <a href="/recruit/requirements#entry" style="min-height:54px;display:flex;align-items:center;justify-content:center;gap:6px;background:#1F63B5;color:#fff;text-decoration:none;font-weight:700;font-size:0.95rem;border-radius:999px;box-shadow:0 12px 28px rgba(31,99,181,.32)">応募・見学</a>
    <a href="tel:0358515790" style="min-height:54px;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:#00293B;border:2px solid #CFE2F4;text-decoration:none;font-weight:700;font-size:0.95rem;border-radius:999px;box-shadow:0 12px 28px rgba(0,57,83,.14)">電話する</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:96}}">
class Component extends DCLogic {
  state = { isMobile: false, menuOpen: false };
  componentDidMount() {
    this._onResize = () => {
      const m = window.innerWidth < 1200;
      if (m !== this.state.isMobile) this.setState({ isMobile: m, menuOpen: m ? this.state.menuOpen : false });
    };
    this._onKey = (e) => { if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false }); };
    window.addEventListener('resize', this._onResize);
    window.addEventListener('keydown', this._onKey);
    this._onResize();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('keydown', this._onKey);
  }
  renderVals() {
    return {
      isMobile: this.state.isMobile,
      showDesktopNav: !this.state.isMobile,
      menuOpen: this.state.menuOpen,
      burgerLabel: this.state.menuOpen ? 'メニューを閉じる' : 'メニューを開く',
      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
    };
  }
}
</script>
</body>
</html>
