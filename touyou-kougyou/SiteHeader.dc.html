<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1366,&quot;height&quot;:140}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1400, menuOpen: false, recruitOpen: false };
  componentDidMount() {
    this._on = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._on);
    this._on();
  }
  componentWillUnmount() { window.removeEventListener('resize', this._on); }
  renderVals() {
    const wide = this.state.w >= 1100;
    return {
      isWide: wide,
      isNarrow: !wide,
      showMobileMenu: !wide && this.state.menuOpen,
      recruitOpen: this.state.recruitOpen,
      openRecruit: () => this.setState({ recruitOpen: true }),
      closeRecruit: () => this.setState({ recruitOpen: false }),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}

</script>
