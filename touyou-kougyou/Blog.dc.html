<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; background: #ffffff; color: #333333; }

</style>
</helmet>
<div style="font-family: Meiryo, 'メイリオ', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; color: #333333; line-height: 1.8;">
  <dc-import name="SiteHeader" hint-size="100%,124px"></dc-import>
  <dc-import name="PageHeader" ja="ブログ" en="BLOG" crumb="ブログ" hint-size="100%,400px"></dc-import>

        <main>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px;">
            <sc-for list="{{ posts }}" as="post" hint-placeholder-count="6">
              <div style="background: #ffffff; border: 1px solid #e5e5e5;">
                <a href="Blog.dc.html" style="display: block; color: #333333;" style-hover="color: #006600;">

                  </div>
                  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px 0; font-family: 'Yu Gothic', '游ゴシック', Meiryo, sans-serif;">
                    <span style="font-size: 13px; color: #666666;">{{ post.date }}</span>
                    <span style="background: #006600; color: #ffffff; border-radius: 5px; padding: 1px 9px; font-size: 12px;">{{ post.cat }}</span>
                  </div>
                  <div style="padding: 8px 14px 16px;">
                    <h3 style="margin: 0; font-size: 15px; font-weight: bold; line-height: 1.6;">{{ post.title }}</h3>
                  </div>
                </a>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 40px; font-family: 'Yu Gothic', '游ゴシック', Meiryo, sans-serif; font-size: 14px;">

            <span style="opacity: .65; padding: 6px 10px; color: #666666;">&lt;&lt;</span>
            <span style="padding: 6px 12px; background: #006600; color: #ffffff;">1</span>
            <a href="Blog.dc.html" style="padding: 6px 12px; border: 1px solid #cccccc;">2</a>
            <a href="Blog.dc.html" style="padding: 6px 12px; border: 1px solid #cccccc;">3</a>
            <a href="Blog.dc.html" style="padding: 6px 12px; border: 1px solid #cccccc;">4</a>
            <a href="Blog.dc.html" style="padding: 6px 12px; border: 1px solid #cccccc;">5</a>
            <a href="Blog.dc.html" style="padding: 6px 10px;">次へ&gt;&gt;</a>
            <a href="Blog.dc.html" style="padding: 6px 10px;">最後&gt;&gt;</a>
          </div>
        </main>
        <aside style="display: flex; flex-direction: column; gap: 30px;">
          <div style="background: #ffffff; border: 1px solid #e5e5e5; padding: 18px;">
            <h3 style="margin: 0 0 12px; font-size: 17px; font-weight: bold; color: #006600; border-bottom: 1px solid #e5e5e5; padding-bottom: 10px;">最近の投稿</h3>
            <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px;">
              <sc-for list="{{ recent }}" as="post" hint-placeholder-count="5">
                <li>
                  <a href="Blog.dc.html" style="display: block; color: #333333;" style-hover="color: #006600;">
                    <span style="display: block; font-size: 12px; color: #666666; font-family: 'Yu Gothic', '游ゴシック', Meiryo, sans-serif;">{{ post.date }}</span>
                    <p style="margin: 2px 0 0; font-size: 14px; font-weight: bold; line-height: 1.6;">{{ post.title }}</p>
                  </a>
                </li>
              </sc-for>
            </ul>
          </div>
          <div style="background: #ffffff; border: 1px solid #e5e5e5; padding: 18px;">
            <h3 style="margin: 0 0 12px; font-size: 17px; font-weight: bold; color: #006600; border-bottom: 1px solid #e5e5e5; padding-bottom: 10px;">カテゴリ</h3>
            <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
              <li><a href="Blog.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #333333; font-size: 14px;" style-hover="color: #006600;"><span>お知らせ</span><span style="color: #666666; font-family: 'Yu Gothic', '游ゴシック', Meiryo, sans-serif;">64</span></a></li>
              <li><a href="Blog.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #333333; font-size: 14px;" style-hover="color: #006600;"><span>コラム</span><span style="color: #666666; font-family: 'Yu Gothic', '游ゴシック', Meiryo, sans-serif;">110</span></a></li>
              <li><a href="Blog.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #333333; font-size: 14px;" style-hover="color: #006600;"><span>新着情報</span><span style="color: #666666; font-family: 'Yu Gothic', '游ゴシック', Meiryo, sans-serif;">89</span></a></li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,520px"></dc-import>
</div>
