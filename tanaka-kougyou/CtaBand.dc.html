<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
</helmet>
<section style="position:relative;background:#1B3A5B;color:#fff;padding:clamp(64px,9vw,120px) clamp(20px,5vw,64px);overflow:hidden;text-align:center;font-family:'Zen Kaku Gothic New',sans-serif">
  <span aria-hidden="true" style="position:absolute;bottom:clamp(8px,2vw,20px);right:clamp(8px,2vw,24px);font-family:'Anton',sans-serif;font-size:clamp(54px,12vw,150px);color:rgba(255,255,255,.06);line-height:.8;max-width:100%;overflow:hidden">CONTACT</span>
  <div style="position:relative;max-width:760px;margin:0 auto">
    <span style="font-family:'Anton',sans-serif;color:#fff;font-size:clamp(12px,2vw,15px);letter-spacing:.16em">GET IN TOUCH</span>
    <h2 style="margin:12px 0 0;font-weight:900;font-size:clamp(1.8rem,5vw,3.2rem);line-height:1.35;white-space:pre-line">{{ heading }}</h2>
    <p style="margin:18px 0 0;font-size:clamp(15px,2.4vw,18px);color:rgba(255,255,255,.85);white-space:pre-line">{{ sub }}</p>
    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:clamp(28px,4vw,42px)">
      <a href="/form/inquiry" style="background:#F2C200;color:#0B1D30;font-weight:900;font-size:clamp(16px,2.4vw,18px);padding:18px 36px;display:flex;justify-content:center;align-items:center;gap:10px;width:300px;max-width:100%" style-hover="background:#ffd633">お問い合わせはこちら<span aria-hidden="true">→</span></a>
      <a href="tel:080-1087-3921" style="border:2px solid rgba(255,255,255,.5);color:#fff;font-weight:700;padding:14px 30px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.2;width:300px;max-width:100%" style-hover="border-color:#F2C200">
        <span style="font-family:'Anton',sans-serif;font-size:clamp(22px,4vw,30px);letter-spacing:.02em">080-1087-3921</span>
        <span style="font-size:12px;opacity:.85">受付 9:00〜21:00 ／ 営業電話お断り</span>
      </a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:420},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;まずは、お気軽にご相談ください。&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;工事のご相談、下請けのご依頼。小さな工事でも、どうぞ。&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      heading: this.props.heading || 'まずは、お気軽にご相談ください。',
      sub: this.props.sub || '工事のご相談、下請けのご依頼。小さな工事でも、どうぞ。',
    };
  }
}
</script>
</body>
</html>
