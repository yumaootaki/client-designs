<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>田中工業様 サイトリニューアル ワイヤーフレーム</title>
<style>
  :root{
    --navy:#1B3A5B;
    --navy-deep:#0B1D30;
    --yellow:#F2C200;
    --gray-bg:#F4F5F7;
    --gray-line:#B9BEC6;
    --gray-box:#E4E6EA;
    --text:#26303B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--gray-bg); color:var(--text);
  }
  .topbar{
    background:var(--navy-deep); color:#fff; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .topbar h1{font-size:15px; margin:0; font-weight:600;}
  .tabs{
    display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px; background:#fff;
    border-bottom:1px solid var(--gray-line); position:sticky; top:0; z-index:10;
  }
  .tab{
    padding:7px 12px; font-size:12px; border-radius:5px; border:1px solid var(--gray-line);
    background:#fff; cursor:pointer; white-space:nowrap;
  }
  .tab.new{border-color:var(--yellow); background:#FFFBEA;}
  .tab.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .page{display:none; max-width:960px; margin:0 auto; padding:24px 16px 60px;}
  .page.active{display:block;}
  .page-label{
    font-size:12px; color:#fff; background:var(--navy); display:inline-block;
    padding:3px 10px; border-radius:4px; margin-bottom:10px;
  }
  .page-label.new-flag{background:#B8860B;}
  h2.page-title{margin:4px 0 18px; font-size:20px;}
  .note{
    font-size:12px; color:#6b5a00; background:#FFF7D6; border:1px dashed var(--yellow);
    padding:8px 10px; border-radius:4px; margin-bottom:14px; line-height:1.6;
  }
  .block{
    border:1px dashed var(--gray-line); background:var(--gray-box);
    padding:14px; margin-bottom:10px; border-radius:4px;
  }
  .block h3{margin:0 0 6px; font-size:13px; color:var(--navy);}
  .block p{margin:0; font-size:12px; color:#556; line-height:1.6;}
  .block.hero{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    color:#fff; border:none;
  }
  .block.hero h3{color:var(--yellow);}
  .block.hero p{color:#dfe6ee;}
  .block.cta{
    background:var(--yellow); border:none; text-align:center;
  }
  .block.cta h3{color:var(--navy-deep);}
  .block.cta p{color:#3a3000;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
  .tag{
    display:inline-block; font-size:10px; background:var(--navy); color:#fff;
    padding:2px 6px; border-radius:3px; margin-right:6px;
  }
  footer.wf{
    background:var(--navy-deep); color:#cdd6e0; font-size:11px; text-align:center; padding:14px;
  }
</style>
</head>
<body>

</div>

<div class="tabs" id="tabs"></div>
<div id="pages"></div>

const tabsEl = document.getElementById("tabs");
const pagesEl = document.getElementById("pages");

pages.forEach((pg, i) => {
  const tab = document.createElement("div");
  tab.className = "tab" + (pg.isNew ? " new" : "") + (i===0 ? " active" : "");
  tab.textContent = pg.label;
  tab.onclick = () => showPage(pg.id);
  tab.dataset.id = pg.id;
  tabsEl.appendChild(tab);

  const pageDiv = document.createElement("div");
  pageDiv.className = "page" + (i===0 ? " active" : "");
  pageDiv.id = "page-" + pg.id;

  let html = `<span class="page-label${pg.isNew ? " new-flag" : ""}">${pg.isNew ? "新規ページ" : "既存ページ(刷新)"}</span>`;
  html += `<h2 class="page-title">${pg.title}</h2>`;
  if (pg.note) html += `<div class="note">${pg.note}</div>`;
  pg.blocks.forEach(b => {
    html += `<div class="block ${b.cls}"><h3>${b.h}</h3><p>${b.p}</p></div>`;
  });
  pageDiv.innerHTML = html;
  pagesEl.appendChild(pageDiv);
});

function showPage(id){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById("page-" + id).classList.add("active");
  document.querySelector(`.tab[data-id="${id}"]`).classList.add("active");
  window.scrollTo({top:0, behavior:"instant"});
}
