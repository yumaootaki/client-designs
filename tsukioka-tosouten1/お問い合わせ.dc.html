<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="theme.css">
<meta property="og:type" content="website">
<meta property="og:site_name" content="有限会社月岡塗装店">

<!-- Webフォント：本番サーバーでは下記1行のコメントを外して有効化する（プレビュー環境では CDN 到達不可のため無効） -->
<!-- <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet"> -->
<style>
  *{box-sizing:border-box;}
  [data-role-grid],[data-method-grid],[data-where-grid],[data-sign-grid],[data-strength-grid],[data-dr-grid],[data-num-grid],[data-charm-grid],[data-career],[data-value-grid],[data-sdgs-grid],[data-cert-grid],[data-flow-grid]{grid-auto-rows:1fr;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:#fff;color:var(--c-ink);font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium','Meiryo',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .rv{opacity:0;transform:translateY(40px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);}
  .rv.show{opacity:1;transform:none;}
  .d1{transition-delay:.1s;}.d2{transition-delay:.2s;}
  @keyframes subheroZoom{from{transform:scale(1.12);}to{transform:scale(1.2);}}
  [data-navitem]:hover [data-dropdown],[data-navitem]:focus-within [data-dropdown]{opacity:1!important;visibility:visible!important;}
  .mnav-toggle,.mnav-btn,.mnav-panel{display:none;}
  @media(max-width:840px){
    nav[data-gnav]{display:none!important;}
    #footer-grid{grid-template-columns:1fr!important;}
    header{align-items:center!important;}
    [data-protect]{display:none!important;}
    .mnav-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;background:var(--c-ink);border-radius:7px;margin:auto 16px;cursor:pointer;flex:none;position:relative;z-index:75;}
    .mnav-btn span{position:absolute;left:12px;right:12px;height:2px;background:#fff;transition:transform .3s ease,opacity .3s ease,top .3s ease;}
    .mnav-btn span:nth-child(1){top:15px;}.mnav-btn span:nth-child(2){top:21px;}.mnav-btn span:nth-child(3){top:27px;}
    .mnav-toggle:checked ~ .mnav-btn span:nth-child(1){top:21px;transform:rotate(45deg);}
    .mnav-toggle:checked ~ .mnav-btn span:nth-child(2){opacity:0;}
    .mnav-toggle:checked ~ .mnav-btn span:nth-child(3){top:21px;transform:rotate(-45deg);}
    .mnav-panel{display:flex;flex-direction:column;position:fixed;inset:0;background:var(--c-ink);z-index:74;padding:90px 26px 40px;transform:translateX(100%);transition:transform .42s cubic-bezier(.16,1,.3,1);overflow-y:auto;}
    .mnav-toggle:checked ~ .mnav-panel{transform:none;}
    .mnav-panel a{color:#fff;font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium','Meiryo',sans-serif;font-size:16px;font-weight:700;padding:15px 4px;border-bottom:1px solid rgba(255,255,255,.12);letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .mnav-panel a.sub{font-size:13.5px;font-weight:500;padding-left:18px;color:rgba(255,255,255,.66);}
    .mnav-panel a em{font-family:'Work Sans','Helvetica Neue',Arial,sans-serif;font-style:normal;font-size:10.5px;letter-spacing:.14em;color:var(--c-brand-2);font-weight:600;}
  }

  /* ===== add.css : parts210 導入文 + parts213 お問い合わせフォーム（実在クラス上書き・フラット） ===== */
  .parts210_section_content{max-width:760px;margin:0 auto;padding:0 clamp(24px,5vw,40px);}
  .parts210_content_wrap{width:100%;}
  .parts210_content{font-size:14px;color:#666;line-height:2.1;text-align:center;}

  .contact_section{max-width:760px;margin:0 auto;padding:clamp(28px,4vh,44px) clamp(24px,5vw,40px) clamp(64px,9vh,110px);}
  .parts213_section_form,.parts213_form_wrap{width:100%;}
  .parts213_form_wrap form dl{display:flex;flex-direction:column;gap:8px;padding:18px 0;border:0;margin:0;}
  .parts213_form_wrap form dt{font-size:14px;font-weight:700;color:var(--c-ink);letter-spacing:.02em;display:flex;align-items:center;gap:10px;margin:0;flex-wrap:wrap;}
  .parts213_form_wrap form dd{margin:0;}
  .parts213_form_wrap .required{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium','Meiryo',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--c-brand);border:1px solid var(--c-brand);padding:2px 8px;border-radius:1px;}
  .parts213_form_wrap .attention{display:block;font-size:11.5px;font-weight:400;color:#c0392b;margin-top:4px;line-height:1.7;letter-spacing:0;}
  .parts213_form_wrap input[type=text],.parts213_form_wrap input[type=email],.parts213_form_wrap textarea{width:100%;font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium','Meiryo',sans-serif;font-size:15px;color:var(--c-ink);background:#fff;border:1px solid #ddd6c6;border-radius:0;padding:13px 14px;outline:none;transition:border-color .25s ease;}
  .parts213_form_wrap input:focus,.parts213_form_wrap textarea:focus{border-color:var(--c-brand);}
  .parts213_form_wrap input::placeholder,.parts213_form_wrap textarea::placeholder{color:#bdb4a2;}
  .parts213_form_wrap textarea{min-height:180px;resize:vertical;line-height:1.8;}
  .parts213_form_wrap .checkbox_wrap,.parts213_form_wrap dd > label{display:flex;align-items:center;gap:8px;font-size:14px;color:#444;font-weight:400;cursor:pointer;}
  .parts213_form_wrap dd > label{margin:0 0 10px;}
  .parts213_form_wrap input[type=checkbox]{width:17px;height:17px;accent-color:var(--c-brand);flex:none;}
  .parts213_form_wrap .error{font-size:12px;color:#c0392b;margin:6px 0 0;}
  .parts213_form_wrap .contact_submit{margin-top:14px;text-align:center;}
  .parts213_form_wrap .contact_submit input{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium','Meiryo',sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--c-ink);border:0;padding:16px 56px;cursor:pointer;transition:background .3s ease;border-radius:0;}
  .parts213_form_wrap .contact_submit input:hover{background:var(--c-brand);}

  @media (prefers-reduced-motion:reduce){
    .rv{opacity:1!important;transform:none!important;transition:none!important;}
    [data-subhero-bg]{animation:none!important;transform:scale(1.12)!important;}
    html{scroll-behavior:auto;}
  }
  @media (max-width:840px){ [data-gnav]{display:none!important;} }
</style>
</helmet>

<div style="position:relative;overflow-x:clip;background:#fff;">

  <!-- ============ HEADER (共通部品) ============ -->
  <dc-import name="Header" hint-size="100%,0" style="position:absolute;top:0;left:0;width:100%;z-index:60;"></dc-import>

  <!-- ============ HERO F ============ -->
  <section id="subhero" data-screen-label="お問い合わせHero" style="position:relative;height:clamp(320px,46vh,460px);overflow:hidden;background:var(--c-ink);">
    <div data-subhero-bg aria-hidden="true" style="position:absolute;inset:0;transform:scale(1.12);animation:subheroZoom 14s ease-in-out infinite alternate;will-change:transform;"><img src="assets/photo-after.png" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block;"></div>
    <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(20,40,55,.48) 0%,rgba(20,40,55,.8) 100%);"></div>
    <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(120deg,rgba(168,205,223,.26) 0%,rgba(47,109,146,.34) 100%);mix-blend-mode:multiply;"></div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;">
      <p class="rv" style="font-family:'Work Sans','Helvetica Neue',Arial,sans-serif;font-size:clamp(11px,1.4vw,13px);letter-spacing:.32em;color:rgba(255,255,255,.78);margin:0 0 18px;">CONTACT</p>
      <h1 class="rv d1" style="font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic Medium','Meiryo',sans-serif;font-weight:900;font-size:clamp(26px,4.4vw,44px);color:#fff;margin:0 0 20px;letter-spacing:.06em;text-shadow:0 2px 24px rgba(20,40,55,.5);">お問い合わせ</h1>
      <span class="rv d2" style="width:60px;height:3px;background:linear-gradient(90deg,var(--c-brand-2),var(--c-brand));display:inline-block;"></span>
    </div>
    <div style="position:absolute;bottom:20px;left:0;right:0;text-align:center;">
      <span style="font-family:'Work Sans','Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.55);">HOME ／ お問い合わせ</span>
    </div>
  </section>

  <!-- ============ 導入文（parts210系・構造維持／デザイン可） ============ -->
  <section class="parts210_section_content" style="padding-top:clamp(56px,8vh,90px);padding-bottom:clamp(8px,2vh,20px);">
    <div class="parts210_content_wrap">
      <p class="rv" style="font-family:'Work Sans','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--c-brand);margin:0 0 20px;text-align:center;">GET IN TOUCH</p>
      <div class="parts210_content rv d1">
        塗り替えのご相談・お見積もりのご依頼など、お気軽にお問い合わせください。現地調査・お見積もりは無料です。はじめてのご相談でも、内容が決まっていない段階でも構いません。<br>内容を確認のうえ、担当者より折り返しご連絡いたします。お急ぎの場合はお電話（042-479-5507）でも承ります。
      </div>
    </div>
  </section>

  <!-- ============ 動的：parts213 お問い合わせフォーム（構造維持・作り直さない） ============ -->
  <section class="contact_section rv">
    <div class="parts213_section_form">
      <div class="parts213_form_wrap">
        <form method="POST" action="/form/confirm/inquiry">
          <dl>
            <dt>お名前 / 企業名<span class="required">必須</span></dt>
            <dd><input type="text" name="name" placeholder="例：山田 太郎 ／ 株式会社◯◯"><p class="error"></p></dd>
          </dl>
          <dl>
            <dt>メールアドレス<span class="required">必須</span></dt>
            <dd><input type="email" name="email" placeholder="例：sample@example.com"><p class="error"></p></dd>
          </dl>
          <dl>
            <dt>メールアドレス（確認用）<span class="required">必須</span></dt>
            <dd><input type="email" name="email_confirmation" placeholder="確認のためもう一度ご入力ください"><p class="error"></p></dd>
          </dl>
          <dl>
            <dt>お問い合わせ項目<span class="required">必須</span></dt>
            <dd>
              <label><input type="checkbox" name="checkbox[]" value="塗り替えのご相談・お見積もり">塗り替えのご相談・お見積もり</label>
              <label><input type="checkbox" name="checkbox[]" value="採用について">採用について</label>
              <label><input type="checkbox" name="checkbox[]" value="協力会社について">協力会社について</label>
              <label><input type="checkbox" name="checkbox[]" value="その他">その他</label>
              <p class="error"></p>
            </dd>
          </dl>
          <dl class="form_textarea">
            <dt class="form_text_dt"><span>お問い合わせ内容<span class="attention">入力は2000文字以内で日本語を含んだ文章でお願いいたします。</span></span><span class="required">必須</span></dt>
            <dd><textarea name="qualification" id="qualification" placeholder="お問い合わせ内容をご記入ください。"></textarea><p class="error"></p></dd>
          </dl>
          <div class="contact_submit">
            <input type="submit" value="確認画面へ">
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ FOOTER (共通部品) ============ -->
  <dc-import name="Footer" hint-size="100%,420px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    // (ヘッダーの色切替は Header.dc.html が担当)
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('show'); io.unobserve(en.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.rv').forEach((el) => io.observe(el));
  }
  componentWillUnmount() { if (this._onScroll) window.removeEventListener('scroll', this._onScroll); }
}
</script>
</body>
</html>
