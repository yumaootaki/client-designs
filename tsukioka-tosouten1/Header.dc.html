<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:110}}">
class Component extends DCLogic {
  componentDidMount() {
    const BRAND = '#1E63C9', INK = '#12345C';
    const upd = () => {
      const hdrBar = document.querySelector('header');
      if (!hdrBar) return;
      const hdrEls = Array.from(document.querySelectorAll('[data-hdr]'));
      const hero = document.querySelector('#top, #subhero');
      const isTop = !!document.querySelector('#top');
      const cta = document.querySelector('[data-cta]');
      const over = hero ? hero.getBoundingClientRect().bottom > 76 : false;
      hdrEls.forEach((e) => {
        e.style.color = over ? '#fff' : INK;
        e.style.textShadow = over ? '0 1px 12px rgba(10,24,40,.55)' : 'none';
      });
      hdrBar.style.background = over ? 'transparent' : 'rgba(255,255,255,.97)';
      hdrBar.style.boxShadow = over ? 'none' : '0 2px 18px rgba(18,52,92,.14)';
      if (cta && isTop) {
        if (over) { cta.style.background = '#fff'; cta.style.color = BRAND; cta.style.boxShadow = '0 3px 16px rgba(10,24,40,.28)'; }
        else { cta.style.background = BRAND; cta.style.color = '#fff'; cta.style.boxShadow = '0 3px 16px rgba(18,52,92,.34)'; }
      }
    };
    let ticking = false;
    this._onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; upd(); }); } };
    window.addEventListener('scroll', this._onScroll, { passive: true, capture: true });
    window.addEventListener('resize', this._onScroll, { passive: true });
    const applyActive = () => {
      const cur = decodeURIComponent((location.pathname.split('/').pop() || '')).toLowerCase();
      if (!cur) return;
      document.querySelectorAll('header nav[data-gnav] > a[data-nav], header [data-navitem]').forEach((item) => {
        const top = item.matches('a[data-nav]') ? item : item.querySelector('a[data-nav]');
        if (!top) return;
        const scope = item.matches('a[data-nav]') ? [item] : Array.from(item.querySelectorAll('a'));
        const hrefs = scope.map((a) => decodeURIComponent((a.getAttribute('href') || '').split('/').pop() || '').toLowerCase());
        if (hrefs.includes(cur)) { top.style.borderBottom = '2px solid var(--c-brand)'; top.style.paddingBottom = '3px'; }
      });
    };
    const t0 = performance.now();
    const settle = () => { upd(); applyActive(); if (performance.now() - t0 < 1200) requestAnimationFrame(settle); };
    requestAnimationFrame(settle);
  }
  componentWillUnmount() {
    if (this._onScroll) { window.removeEventListener('scroll', this._onScroll, { capture: true }); window.removeEventListener('resize', this._onScroll); }
  }
  renderVals() { return {}; }
}
</script>
