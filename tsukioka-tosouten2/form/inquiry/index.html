<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ｜有限会社月岡塗装店</title>
<meta name="description" content="有限会社月岡塗装店へのお問い合わせフォーム。工事のご依頼・お見積り・採用のご相談はこちらからどうぞ。">
<link rel="canonical" href="https://tsukiokatosouten.com/form/inquiry">
<meta property="og:type" content="website">
<meta property="og:title" content="お問い合わせ｜有限会社月岡塗装店">
<meta property="og:description" content="業務依頼・採用・協力会社のご相談はお問い合わせフォームからどうぞ。">
<meta property="og:url" content="https://tsukiokatosouten.com/form/inquiry">
<meta property="og:site_name" content="有限会社月岡塗装店">
<meta property="og:image" content="https://tsukiokatosouten.com/img/ogp.png">
<meta property="og:image:width" content="640">
<meta property="og:image:height" content="480">
<link rel="icon" type="image/png" href="../../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Italianno&family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../add.css">
</head>
<body>

<!-- 共通ヘッダー（include.js が partials/header.html を注入） -->
<div id="site-header"></div>

<div class="layout">
<main>

  <!-- ============ PAGE HEADER ============ -->
  <header class="page-hdr">
    <div class="page-hdr-inner">
      <span class="page-hdr-en">Contact</span>
      <h1 class="page-hdr-title">お問い合わせ</h1>
      <p class="page-hdr-desc">塗り替えのご相談・お見積り・採用のご相談はこちらからどうぞ。現地診断とお見積りは無料です。お急ぎの場合はお電話が確実です。</p>
    </div>
  </header>
  <nav class="breadcrumb" aria-label="パンくずリスト">
    <ol>
      <li><a href="../../index.html">HOME</a></li>
      <li aria-current="page">お問い合わせ</li>
    </ol>
  </nav>

  <!-- ============ FORM ============ -->
  <section class="sec">
    <div class="wrap">
      <div class="form-block">
        <p class="body-txt" style="margin-bottom:clamp(28px,4vw,40px);">
          下記フォームにご入力の上、送信してください。<br>
          <strong>営業電話・DM目的のお問い合わせはお断りします。</strong>
        </p>

        <form method="post" action="#" novalidate>
          <!-- ハニーポット -->
          <input type="text" name="_honey" style="display:none;" tabindex="-1" autocomplete="off">

          <div class="form-group">
            <label class="form-label" for="name">
              お名前<span class="form-req">必須</span>
            </label>
            <input class="form-input" type="text" id="name" name="name" autocomplete="name" required placeholder="例）山田 太郎">
          </div>

          <div class="form-group">
            <label class="form-label" for="company">
              会社名・施設名<span class="form-opt">任意</span>
            </label>
            <input class="form-input" type="text" id="company" name="company" autocomplete="organization" placeholder="法人・管理会社の方のみご記入ください">
          </div>

          <div class="form-group">
            <label class="form-label" for="email">
              メールアドレス<span class="form-req">必須</span>
            </label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" required placeholder="example@mail.com">
          </div>

          <div class="form-group">
            <label class="form-label" for="tel">
              電話番号<span class="form-opt">任意</span>
            </label>
            <input class="form-input" type="tel" id="tel" name="tel" autocomplete="tel" placeholder="042-479-5507">
          </div>

          <div class="form-group">
            <label class="form-label" for="category">
              お問い合わせ種別<span class="form-req">必須</span>
            </label>
            <select class="form-select" id="category" name="category" required>
              <option value="" disabled selected>選択してください</option>
              <option value="work">外壁・屋根塗装のご依頼</option>
              <option value="estimate">現地診断・お見積りのご依頼</option>
              <option value="recruit">採用について</option>
              <option value="partner">協力会社・専属外注について</option>
              <option value="other">その他</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="message">
              ご要望・ご質問<span class="form-opt">任意</span>
            </label>
            <textarea class="form-textarea" id="message" name="message" placeholder="気になっている症状（色あせ・ひび割れ・雨漏りなど）、ご希望の時期、ご予算の目安などをご記入ください。"></textarea>
          </div>

          <p class="form-privacy">
            送信前に<a href="../../privacypolicy/index.html">プライバシーポリシー</a>をご確認ください。送信をもってご同意いただいたものとみなします。
          </p>

          <div class="form-submit">
            <button class="btn" type="submit">送信する
              <svg viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M0 7h22M16 1l6 6-6 6"/></svg>
            </button>
          </div>
        </form>
      </div>

    </div>
  </section>

</main>

<!-- 共通フッター（include.js が partials/footer.html を注入） -->
<div id="site-footer"></div>
</div>

<script src="../../js/include.js"></script>
</body>
</html>
