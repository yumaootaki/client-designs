<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>有限会社星電気工事 リプレイス ワイヤーフレーム(全14ページ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF; --sky:#EAF5FB; --aqua:#5BB8E6; --blue:#1F5FA8; --navy:#0F2E57;
  --line:#D5E3EE; --mute:#6B7F95; --ph:#F2F6F9; --bg:#F5F8FB; --warn:#C2410C;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:var(--navy);background:var(--bg);line-height:1.75;font-size:15px}
h1,h2,h3,h4{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;line-height:1.4;margin:0}
a{color:inherit}
.topbar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.topbar h1{font-size:17px;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.side h4{font-size:12px;color:var(--mute);margin:14px 6px 6px;font-weight:500}
.side button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;font-size:14px;color:var(--navy);cursor:pointer}
.side button:hover{background:var(--sky)}
.side button[aria-current="true"]{background:var(--blue);color:#fff}
.side button:focus-visible,.m-btn:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;white-space:nowrap}
.tag.old{background:#E5ECF2;color:var(--mute)}
.tag.new{background:var(--aqua);color:#fff}
button[aria-current="true"] .tag{background:#fff;color:var(--blue)}
main{padding:28px clamp(16px,3vw,40px) 80px;min-width:0}
.page{max-width:1100px;margin:0 auto}
.meta{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:22px}
.meta h2{font-size:22px;margin-bottom:10px}
.meta dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:0;font-size:14px}
.meta dt{color:var(--mute)}
.meta dd{margin:0}
.frame{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sec{display:grid;grid-template-columns:200px 1fr;border-top:1px dashed var(--line)}
.sec:first-child{border-top:0}
.lab{padding:18px 16px;background:#FAFCFD;border-right:1px dashed var(--line);font-size:12px;color:var(--mute)}
.lab b{display:block;font-size:14px;color:var(--navy);margin-bottom:4px}
.lab .n{color:var(--blue);font-weight:700}
.mock{padding:22px 24px;min-width:0}
.ph{background:repeating-linear-gradient(135deg,var(--ph) 0 10px,#E8EEF3 10px 20px);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;min-height:110px;text-align:center;padding:8px}
.m-btn{display:inline-block;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700;text-decoration:none;border:2px solid var(--blue)}
.m-btn.pri{background:var(--blue);color:#fff}
.m-btn.sec2{background:#fff;color:var(--blue)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.req{color:var(--warn);font-weight:700}
/* header / footer mock */
.gh{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:17px}
.gnav{display:flex;gap:14px;font-size:13px;flex-wrap:wrap;flex:1}
.gtel{font-size:13px;font-weight:700;color:var(--blue)}
.gf{background:var(--navy);color:#DCE8F3;padding:22px 20px;font-size:12px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px}
.gf b{color:#fff;font-size:14px;display:block;margin-bottom:6px}
/* hero */
.m-hero{position:relative;background:linear-gradient(180deg,#fff 0%,var(--sky) 100%);border-radius:8px;padding:34px 30px 30px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;overflow:hidden}
.m-hero.small{grid-template-columns:1fr;padding:26px 28px}
.m-hero h2{font-size:clamp(24px,3.2vw,36px);font-weight:900;letter-spacing:.02em}
.m-hero.small h2{font-size:26px}
.m-hero p{max-width:34em}
.band{margin-top:18px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--aqua);padding:10px 14px;font-size:13px;border-radius:4px}
.wire{position:absolute;left:0;right:0;top:8px;height:120px;pointer-events:none}
.wire .base{fill:none;stroke:var(--navy);stroke-width:2;opacity:.55}
.wire .sleeve{fill:none;stroke:var(--aqua);stroke-width:10;stroke-linecap:round;stroke-dasharray:150 1000;stroke-dashoffset:150;animation:slide 2.4s cubic-bezier(.3,.7,.2,1) .4s forwards}
@keyframes slide{to{stroke-dashoffset:-430}}
@media (prefers-reduced-motion:reduce){.wire .sleeve{animation:none;stroke-dashoffset:-430}}
.has-line{padding-top:120px}
/* generic blocks */
.m-h{font-size:20px;font-weight:700;margin-bottom:6px}
.m-sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}
.card h4{font-size:15px;margin:8px 0 4px}
.card p{font-size:13px;margin:0;color:#3C5470}
.card .ph{min-height:80px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border-top:3px solid var(--blue);padding:10px 4px}
.stat strong{font-family:"Zen Kaku Gothic New";font-size:26px;font-weight:900;display:block;color:var(--blue)}
.stat span{font-size:12px;color:var(--mute)}
.steps{counter-reset:s;display:grid;gap:10px}
.step{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}
.step::before{counter-increment:s;content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--sky);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center}
.step h4{font-size:15px}
.step p{margin:2px 0 0;font-size:13px;color:#3C5470}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.tbl th{width:30%;background:#FAFCFD;font-weight:500;color:var(--mute)}
.tblwrap{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:#fff}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:700}
.faq summary::before{content:"Q. ";color:var(--blue)}
.faq p{margin:6px 0 0;font-size:14px}
.faq p::before{content:"A. ";color:var(--aqua);font-weight:700}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.m-banner{background:var(--navy);color:#fff;border-radius:8px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.m-banner p{margin:4px 0 0;color:#C9DBEC;font-size:14px}
.m-banner .m-btn{border-color:#fff;background:#fff;color:var(--navy)}
.m-cta{background:var(--sky);border-radius:8px;padding:26px;text-align:center}
.m-cta .btns{justify-content:center}
.form{display:grid;gap:10px}
.field{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;font-size:13px}
.field .inp{height:36px;border:1px solid var(--line);border-radius:6px;background:#FAFCFD}
.tl{border-left:2px solid var(--aqua);padding-left:16px;display:grid;gap:10px}
.tl div b{color:var(--blue);margin-right:10px}
.note{font-size:12px;color:var(--mute);margin-top:10px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:10px}
  .side h4{display:none}
  .side button{white-space:nowrap;width:auto}
  .sec{grid-template-columns:1fr}
  .lab{border-right:0;border-bottom:1px dashed var(--line)}
  .m-hero,.twocol,.m-banner,.gf{grid-template-columns:1fr}
  .field{grid-template-columns:1fr}
  .meta dl{grid-template-columns:1fr}
}
</style>
</head>

  case 'cards': return `${s.h?`<div class="m-h">${s.h}</div>`:''}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(${s.cols>=4?150:190}px,1fr))">${s.items.map(i=>`<div class="card">${s.img?'<div class="ph">写真</div>':''}<h4>${i[0]}</h4><p>${i[1]}</p></div>`).join('')}</div>`;
  case 'steps': return `${s.h?`<div class="m-h">${s.h}</div>`:''}<div class="steps">${s.items.map(i=>`<div class="step"><div><h4>${i[0]}</h4><p>${i[1]}</p></div></div>`).join('')}</div>`;
  case 'table': return `<div class="tblwrap"><table class="tbl">${s.rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table></div>`;
  case 'price': return `<div class="tblwrap"><table class="tbl"><tr><th>項目</th><th style="width:22%">目安価格(税別)</th><th>備考</th></tr>${s.rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join('')}</table></div>`;
  case 'chips': return `${s.h?`<div class="m-h">${s.h}</div>`:''}<div class="chips">${s.items.map(i=>`<span class="chip">${i}</span>`).join('')}</div>`;
  case 'faq': return `<div class="faq">${s.items.map(i=>`<details><summary>${i[0]}</summary><p>${i[1]}</p></details>`).join('')}</div>`;
  case 'twocol': return `<div class="twocol"><div>${s.a}</div><div>${s.b}</div></div>`;
  case 'text': return `<div class="m-h">${s.h}</div><p>${s.body}</p>`;
  case 'timeline': return `<div class="tl">${s.items.map(i=>`<div><b>${i[0]}</b>${i[1]}</div>`).join('')}</div>`;
  case 'banner': return `<div class="m-banner"><div><h3>${s.h}</h3><p>${s.sub}</p></div><a class="m-btn" href="#" onclick="return false">${s.cta}</a></div>`;
  case 'cta': return `<div class="m-cta"><h3>${s.h}</h3>${s.sub?`<p>${s.sub}</p>`:''}${btns(s.ctas)}</div>`;
  case 'form': return `<div class="form">${s.fields.map(f=>`<div class="field"><span>${f}</span><div class="inp"></div></div>`).join('')}<div class="btns"><a class="m-btn pri" href="#" onclick="return false">内容を確認する</a></div></div>`;
  }
  return '';
}
const HEADER = `<div class="gh"><span class="logo">有限会社星電気工事</span><div class="gnav"><span>防護管リース</span><span>業務案内</span><span>料金表</span><span>施工実績</span><span>星電気工事について</span><span>採用情報</span></div><span class="gtel">048-774-1378</span><a class="m-btn pri" href="#" onclick="return false" style="padding:7px 14px">見積り依頼</a></div>`;
const FOOTER = `<div class="gf"><div><b>有限会社星電気工事</b>〒362-0011 埼玉県上尾市大字平塚1987-5<br>川越事務所:川越市石原町27-1${'【要確認】'}<br>TEL 048-774-1378/FAX 048-773-8631</div><div><b>ご依頼の方</b>防護管リース/業務案内/料金表/施工実績/ご依頼を検討中の方へ/FAQ/お問い合わせ</div><div><b>会社・採用</b>星電気工事について/会社概要/スタッフ紹介/求職者の皆さまへ/採用情報/ブログ</div></div>`;

function render(id){
  const p = PAGES.find(x=>x.id===id) || PAGES[0];
  side.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current', b.dataset.id===p.id));
  main.innerHTML = `<div class="page">
   <div class="meta"><h2>${p.name} <span class="tag ${p.kind}">${p.kind==='new'?'新規':'既存リライト'}</span></h2>
    <dl><dt>URL</dt><dd>${p.url}</dd><dt>ページの目的</dt><dd>${p.goal}</dd><dt>狙うキーワード</dt><dd>${p.kw}</dd><dt>導線</dt><dd>${p.flow}</dd></dl></div>
   <div class="frame">${HEADER}
    ${p.secs.map((s,i)=>`<section class="sec"><div class="lab"><span class="n">${String(i+1).padStart(2,'0')}</span><b>${s.name}</b>${s.aim||''}</div><div class="mock">${block(s)}</div></section>`).join('')}
    ${FOOTER}</div></div>`;
  window.scrollTo(0,0);
  history.replaceState(null,'','#'+p.id);
}
function buildNav(){
  const g = (k,label)=>`<h4>${label}</h4>`+PAGES.filter(p=>p.kind===k).map(p=>`<button data-id="${p.id}">${p.name}<span class="tag ${k}">${k==='new'?'新規':'既存'}</span></button>`).join('');
  side.innerHTML = g('old','既存ページ(リライト)・7P') + g('new','新規ページ・7P');
  side.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.id)));
}
buildNav();
render(location.hash.slice(1)||'top');
</script>
