<script type="text/x-dc" data-dc-script data-props="{&quot;textRevealSec&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1.1,&quot;min&quot;:0.4,&quot;max&quot;:2.4,&quot;step&quot;:0.1}}">
class Component extends DCLogic {
  componentDidMount() { this._setupReveal(); }

  _setupReveal() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const root = document.getElementById('top');
    if (!root) return;
    this._wave = 0;
    const targets = [];
    root.querySelectorAll('section:not(#pagehead)').forEach((sec) => {
      sec.querySelectorAll('h2,h3,p,li,dt,dd,figure,details').forEach((el) => {
        if (el.dataset.rv || el.closest('[data-rv]')) return;
        el.dataset.rv = '1';
        el.style.opacity = '0';
        el.style.transform = 'translateY(22px)';
        targets.push(el);
      });
    });
    this._revealTargets = targets;
    this._rio = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) this._reveal(en.target); });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    targets.forEach((el) => this._rio.observe(el));
    this._onRevealScroll = () => this._revealInView();
    window.addEventListener('scroll', this._onRevealScroll, { passive: true });
    this._revealInView();
    this._revealSafety = setTimeout(() => { (this._revealTargets || []).forEach((el) => this._reveal(el)); }, 4000);
  }

  _revealInView() {
    const vh = window.innerHeight || 800;
    (this._revealTargets || []).forEach((el) => {
      if (el.dataset.rvDone) return;
      const r = el.getBoundingClientRect();
      if (r.top < vh * 0.94 && r.bottom > 0) this._reveal(el);
    });
  }

  _reveal(el) {
    if (el.dataset.rvDone) return;
    el.dataset.rvDone = '1';
    if (this._rio) this._rio.unobserve(el);
    const dur = this.props.textRevealSec ?? 1.1;
    el.style.animation = 'bleedReveal ' + dur + 's cubic-bezier(.22,.61,.36,1) ' + (this._wave * 0.07) + 's forwards';
    this._wave++;
    clearTimeout(this._waveT);
    this._waveT = setTimeout(() => { this._wave = 0; }, 220);
    const fin = () => { el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; el.style.filter = 'none'; };
    el.addEventListener('animationend', fin, { once: true });
    setTimeout(fin, dur * 1000 + 900);
  }

  componentWillUnmount() {
    if (this._rio) this._rio.disconnect();
    if (this._onRevealScroll) window.removeEventListener('scroll', this._onRevealScroll);
    clearTimeout(this._revealSafety);
  }

  renderVals() { return {}; }
}
</script>
